<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>뭉클 O/X 퀴즈</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:"Pretendard","Noto Sans KR","Malgun Gothic",sans-serif; user-select:none; }
html,body { width:100%; height:100%; overflow:hidden; }
body { background:#FFF9E8; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:26px; padding:20px; }
#progress { font-size:22px; font-weight:700; color:#8a7a5a; }
#question { font-size:38px; font-weight:800; text-align:center; line-height:1.4; min-height:2.8em; max-width:900px; }
#buttons { display:flex; gap:40px; }
#buttons button { width:220px; height:220px; border:none; border-radius:30px; font-size:110px;
  font-weight:900; cursor:pointer; color:#fff; box-shadow:0 8px 0 rgba(0,0,0,.2); }
#btn-o { background:#2e9e44; } #btn-x { background:#F5573B; }
#buttons button:active { transform:translateY(5px); box-shadow:0 3px 0 rgba(0,0,0,.2); }
#feedback { font-size:30px; font-weight:800; min-height:1.4em; text-align:center; }
#feedback .exp { display:block; font-size:22px; font-weight:500; color:#6a5a4a; margin-top:6px; }
#overlay { position:fixed; inset:0; background:rgba(0,0,0,.55); display:none;
  align-items:center; justify-content:center; flex-direction:column; gap:18px; color:#fff; }
#overlay.show { display:flex; }
#overlay h1 { font-size:54px; }
#overlay button { font-size:30px; font-weight:800; padding:18px 44px; border:none;
  border-radius:16px; background:#F5573B; color:#fff; cursor:pointer; }
</style>
</head>
<body>
<div id="progress"></div>
<div id="question"></div>
<div id="buttons">
  <button id="btn-o">O</button>
  <button id="btn-x">X</button>
</div>
<div id="feedback"></div>
<div id="overlay"><h1 id="ov-title"></h1><p id="ov-sub" style="font-size:28px"></p><button onclick="start()">다시 하기</button></div>
<script>
"use strict";
/* ── 문항은 여기만 고치면 됩니다 (콘텐츠 교체 지점) ── */
const QUESTIONS = [
  { q: "뭉클 떡집에서는 나만의 클리커를 만들 수 있다.", a: true,  exp: "퀴즈 풀고 도안 만들어 직접 꾸며요!" },
  { q: "부스에 숨은 떡 몬스터는 모두 4마리다.",         a: true,  exp: "부스 곳곳에 숨어 있어요. 다 만나 보세요!" },
  { q: "떡 몬스터 퀴즈는 컴퓨터로만 풀 수 있다.",       a: false, exp: "내 스마트폰으로 몬스터에 콕! 접촉하면 돼요." },
  { q: "만들기존에 가려면 화면의 '띵동' 호출을 기다리면 된다.", a: true, exp: "자리에서 기다리면 화면이 알려줘요." },
  { q: "완성한 클리커는 김토티 심사를 받을 수 있다.",   a: true,  exp: "이벤트존에서 심사받고 경품 룰렛까지!" },
];
let idx = 0, score = 0, waiting = false;
const $ = id => document.getElementById(id);

function start(){
  $("overlay").classList.remove("show");
  idx = 0; score = 0; waiting = false;
  render();
}
function render(){
  $("progress").textContent = `${idx + 1} / ${QUESTIONS.length}`;
  $("question").textContent = QUESTIONS[idx].q;
  $("feedback").textContent = "";
}
function answer(v){
  if (waiting) return;
  waiting = true;
  const cur = QUESTIONS[idx];
  const right = v === cur.a;
  if (right) score++;
  $("feedback").innerHTML = (right ? "⭕ 정답!" : "❌ 아쉬워요!") +
    `<span class="exp">${cur.exp}</span>`;
  setTimeout(() => {
    waiting = false;
    idx++;
    if (idx >= QUESTIONS.length){
      $("ov-title").textContent = score === QUESTIONS.length ? "🏆 만점!" : "🎉 참 잘했어요!";
      $("ov-sub").textContent = `${QUESTIONS.length}문제 중 ${score}문제 정답`;
      $("overlay").classList.add("show");
    } else render();
  }, 1800);
}
$("btn-o").addEventListener("click", () => answer(true));
$("btn-x").addEventListener("click", () => answer(false));
start();
</script>
</body>
</html>
