<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>다른 몬스터 찾기</title>
<style>
/* 브랜드 서체: esamanru — /kiosk/fonts/ 의 woff2 교체로 변경 */
@font-face { font-family:"esamanru"; font-weight:300; font-display:swap; src:url("/kiosk/fonts/esamanru-light.woff2") format("woff2"); }
@font-face { font-family:"esamanru"; font-weight:400 600; font-display:swap; src:url("/kiosk/fonts/esamanru-medium.woff2") format("woff2"); }
@font-face { font-family:"esamanru"; font-weight:700 900; font-display:swap; src:url("/kiosk/fonts/esamanru-bold.woff2") format("woff2"); }

* { margin:0; padding:0; box-sizing:border-box; font-family:"esamanru","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif; user-select:none; }
html,body { width:100%; height:100%; overflow:hidden; }
body { background:#F3ECFF; display:flex; flex-direction:column; align-items:center; }
header { display:flex; gap:36px; padding:14px; font-size:26px; font-weight:800; color:#5a3a8a; }
#grid { flex:1; display:grid; gap:10px; align-content:center; }
#grid button { border:none; border-radius:14px; background:#fff; cursor:pointer;
  box-shadow:0 3px 0 rgba(0,0,0,.1); display:flex; align-items:center; justify-content:center; }
#grid button.wrong { background:#ffd9d0; }
#overlay { position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex;
  align-items:center; justify-content:center; flex-direction:column; gap:18px; color:#fff; }
#overlay.hide { display:none; }
#overlay h1 { font-size:54px; }
#overlay button { font-size:30px; font-weight:800; padding:18px 44px; border:none;
  border-radius:16px; background:#F5573B; color:#fff; cursor:pointer; }
</style>
</head>
<body>
<header><span>🔍 다른 몬스터 찾기</span><span id="time">45초</span><span id="level">1단계</span></header>
<div id="grid"></div>
<div id="overlay"><h1 id="ov-title">다른 몬스터 찾기</h1><p id="ov-sub" style="font-size:26px">무리 속에 하나만 다른 몬스터가 있어요!</p><button onclick="start()">시작!</button></div>
<script>
"use strict";
/* 비슷한 이모지 짝 — [무리, 숨은 하나] (이미지 없을 때 폴백) */
const PAIRS = [
  ["🐸","🐢"], ["🐤","🐥"], ["🦊","🦝"], ["🐙","🦑"], ["🐳","🐋"],
  ["😀","😃"], ["🌕","🌝"], ["⭐","🌟"], ["🍩","🍪"], ["🎈","🍎"],
];
/* 이미지 슬롯: assets/몬스터01.png ~ 몬스터28.png — 있으면 매 판 무작위 두 마리로 진행 */
const MONSTERS = [];
for (let i = 1; i <= 28; i++){
  const im = new Image();
  im.src = `assets/몬스터${String(i).padStart(2, "0")}.png`;
  im.onload = () => MONSTERS.push(im.src);
}
const $ = id => document.getElementById(id);
let level = 1, time = 45, playing = false, tickTimer = null;

function start(){
  $("overlay").classList.add("hide");
  level = 1; time = 45; playing = true;
  update();
  tickTimer = setInterval(() => { time--; update(); if (time <= 0) end(); }, 1000);
  round();
}
function update(){
  $("time").textContent = `${time}초`;
  $("level").textContent = `${level}단계`;
}
/* 같은 몬스터의 색상 변형 생성 (레벨이 오를수록 색 차이가 미세해져 어려워짐) */
let roundSeq = 0;
function variantOf(src, deg, cb){
  const im = new Image();
  im.onload = () => {
    try {
      const cv = document.createElement("canvas");
      cv.width = im.naturalWidth; cv.height = im.naturalHeight;
      const ctx = cv.getContext("2d");
      ctx.filter = `hue-rotate(${deg}deg)`;
      ctx.drawImage(im, 0, 0);
      cb(cv.toDataURL());
    } catch (e) { cb(null); }
  };
  im.onerror = () => cb(null);
  im.src = src;
}
function round(){
  const n = Math.min(2 + level, 7); // 3×3 → 최대 7×7
  const cell = Math.min(90, Math.floor(430 / n));
  const useImg = MONSTERS.length >= 2;
  const seq = ++roundSeq;
  if (useImg && level >= 4){
    // 4단계부터: 같은 몬스터 + 색만 살짝 다른 변형 — 갈수록 각도가 줄어 미세해진다
    const base = MONSTERS[Math.floor(Math.random() * MONSTERS.length)];
    const deg = Math.max(22, 110 - (level - 3) * 16);
    variantOf(base, deg, v => {
      if (seq !== roundSeq || !playing) return; // 라운드가 이미 넘어갔으면 무시
      if (v) buildGrid(n, cell, base, v, true);
      else { // 캔버스 실패 폴백: 다른 몬스터
        let oi = Math.floor(Math.random() * MONSTERS.length);
        buildGrid(n, cell, base, MONSTERS[oi === MONSTERS.indexOf(base) ? (oi + 1) % MONSTERS.length : oi], true);
      }
    });
    return;
  }
  let base, odd;
  if (useImg){
    const bi = Math.floor(Math.random() * MONSTERS.length);
    let oi = Math.floor(Math.random() * (MONSTERS.length - 1));
    if (oi >= bi) oi++;
    base = MONSTERS[bi]; odd = MONSTERS[oi];
  } else {
    [base, odd] = PAIRS[Math.floor(Math.random() * PAIRS.length)];
  }
  buildGrid(n, cell, base, odd, useImg);
}
function buildGrid(n, cell, base, odd, useImg){
  const grid = $("grid");
  grid.style.gridTemplateColumns = `repeat(${n}, ${cell}px)`;
  grid.style.gridAutoRows = `${cell}px`;
  grid.innerHTML = "";
  const oddIdx = Math.floor(Math.random() * n * n);
  for (let i = 0; i < n * n; i++){
    const b = document.createElement("button");
    const face = i === oddIdx ? odd : base;
    if (useImg) b.innerHTML = `<img src="${face}" style="height:${Math.floor(cell * .74)}px" draggable="false">`;
    else { b.textContent = face; b.style.fontSize = Math.floor(cell * .62) + "px"; }
    b.addEventListener("click", () => {
      if (!playing) return;
      if (i === oddIdx){ level++; time = Math.min(time + 3, 60); update(); round(); } // 보너스 3초
      else { b.classList.add("wrong"); time = Math.max(time - 2, 1); update();
             setTimeout(() => b.classList.remove("wrong"), 300); }
    });
    grid.appendChild(b);
  }
}
function end(){
  playing = false;
  clearInterval(tickTimer);
  $("grid").innerHTML = "";
  $("ov-title").textContent = "⏰ 끝!";
  $("ov-sub").textContent = `${level - 1}단계까지 통과했어요!`;
  document.querySelector("#overlay button").textContent = "다시 하기";
  $("overlay").classList.remove("hide");
}
</script>
</body>
</html>
