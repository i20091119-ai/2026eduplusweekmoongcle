<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>기우뚱 떡시루</title>
<style>
/* 브랜드 서체: esamanru — /kiosk/fonts/ 의 woff2 교체로 변경 */
@font-face { font-family:"esamanru"; font-weight:300; font-display:swap; src:url("/kiosk/fonts/esamanru-light.woff2") format("woff2"); }
@font-face { font-family:"esamanru"; font-weight:400 600; font-display:swap; src:url("/kiosk/fonts/esamanru-medium.woff2") format("woff2"); }
@font-face { font-family:"esamanru"; font-weight:700 900; font-display:swap; src:url("/kiosk/fonts/esamanru-bold.woff2") format("woff2"); }

/* 균형 저울 게임의 '실시간 기울기 피드백' + 그램수 표시 버전 —
 * 등식은 없지만 떡마다 무게(g)와 양쪽 합계를 보여줘서 조합 퍼즐로 푼다. 클릭만으로 조작. */
* { margin:0; padding:0; box-sizing:border-box; font-family:"esamanru","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif; user-select:none; }
html,body { width:100%; height:100%; overflow:hidden; }
body { background:#FFF9EF; display:flex; flex-direction:column; align-items:center; }
header { display:flex; gap:30px; padding:12px; font-size:24px; font-weight:800; color:#7E212F; }
#hint { font-size:22px; font-weight:700; color:#8a6d4f; min-height:1.4em; }
#scale-area { position:relative; width:820px; height:300px; margin-top:8px; }
#beam { position:absolute; left:50%; top:70px; width:640px; height:14px; margin-left:-320px;
  background:#7E212F; border-radius:7px; transition:transform .5s; transform-origin:center; }
#pillar { position:absolute; left:50%; top:78px; width:18px; height:150px; margin-left:-9px;
  background:#7E212F; border-radius:6px; }
#base { position:absolute; left:50%; top:224px; width:200px; height:18px; margin-left:-100px;
  background:#7E212F; border-radius:9px; }
.pan { position:absolute; top:6px; width:230px; min-height:96px; border-radius:0 0 60px 60px;
  background:#F2C744; box-shadow:inset 0 -8px 0 rgba(0,0,0,.15);
  display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:center; gap:2px; padding:8px 6px 14px;
  transition:transform .5s; }
#pan-left  { left:-16px; }
#pan-right { right:-16px; }
.pan .t { line-height:1; display:flex; flex-direction:column; align-items:center; }
.pan .t small, #tray button small { font-size:15px; font-weight:800; color:#7E212F;
  background:#FFF9EF; border-radius:8px; padding:1px 7px; margin-top:2px; }
#pan-right .t { cursor:pointer; }
#pan-right .t:hover { filter:brightness(1.15); }
#totals { display:flex; gap:26px; font-size:24px; font-weight:900; color:#3d2723; margin-top:2px; }
#totals .diff { color:#c0392b; }
#totals .ok { color:#1fae8e; }
#tray { display:flex; gap:16px; align-items:flex-end; justify-content:center;
  background:#EADFCE; border-radius:20px; padding:14px 26px; min-height:110px; margin-top:14px; }
#tray button { border:none; background:transparent; cursor:pointer; line-height:1; }
#tray button:active { transform:scale(.9); }
#tray-label { font-size:18px; font-weight:800; color:#8a6d4f; margin-top:6px; }
#overlay { position:fixed; inset:0; background:rgba(43,30,25,.6); display:flex; z-index:5;
  align-items:center; justify-content:center; flex-direction:column; gap:18px; color:#fff; }
#overlay.hide { display:none; }
#overlay h1 { font-size:52px; }
#overlay button { font-size:30px; font-weight:800; padding:18px 44px; border:none;
  border-radius:16px; background:#7E212F; color:#F2C744; cursor:pointer; }
.level-flash { animation:levelglow 1s; }
@keyframes levelglow { 0%,100%{filter:none} 50%{filter:drop-shadow(0 0 24px #F2C744)} }
</style>
</head>
<body>
<header><span>⚖️ 기우뚱 떡시루</span><span id="time">90초</span><span id="round">1 / 5판</span></header>
<div id="hint">왼쪽 시루와 수평이 되게, 아래 떡을 골라 오른쪽 시루에 올려요! (올린 떡을 누르면 다시 내려요)</div>
<div id="totals"></div>
<div id="scale-area">
  <div id="pillar"></div><div id="base"></div>
  <div id="beam">
    <div class="pan" id="pan-left"></div>
    <div class="pan" id="pan-right"></div>
  </div>
</div>
<div id="tray"></div>
<div id="tray-label">떡 보관함 — 클릭해서 올리기</div>
<div id="overlay"><h1 id="ov-title">기우뚱 떡시루</h1><p id="ov-sub" style="font-size:26px">숫자 없이 눈대중으로! 저울을 수평으로 만들어요</p><button onclick="start()">시작!</button></div>
<script>
"use strict";
/* 이미지 슬롯: assets/떡1.png ~ 떡6.png — 없으면 이모지 */
const EMOJIS = ["🍡","🥮","🍚","🌕","🧁","🥯"];
const FACE = EMOJIS.map(() => null);
EMOJIS.forEach((_, i) => {
  const im = new Image();
  im.src = `assets/떡${i + 1}.png`;
  im.onload = () => { FACE[i] = im.src; };
});
function face(ei, px){
  return FACE[ei] ? `<img src="${FACE[ei]}" style="height:${px}px">` : `<span style="font-size:${px}px">${EMOJIS[ei]}</span>`;
}
const $ = id => document.getElementById(id);
let leftItems = [], tray = [], right = [], round = 1, time = 90, tick = null, playing = false, uid = 0, ended = false;

function start(){
  $("overlay").classList.add("hide");
  round = 1; time = 90; playing = true; ended = false;
  clearInterval(tick);
  tick = setInterval(() => {
    time--;
    if (time <= 0){ time = 0; if (playing) end(false); } // 클리어 연출 중이면 타임아웃은 연출 뒤 처리
    hud();
  }, 1000);
  newRound();
}
function hud(){
  $("time").textContent = `${time}초`;
  $("round").textContent = `${round} / 5판`;
}
function item(w){
  return { id: uid++, w, ei: Math.floor(Math.random() * EMOJIS.length) };
}
function newRound(){
  hud();
  // 왼쪽: 2~3개 (합 L) / 보관함: 정답 부분집합(합 L, 2~3개) + 미끼 3개
  const nl = 2 + (round > 2 ? 1 : 0);
  leftItems = Array.from({length: nl}, () => item(2 + Math.floor(Math.random() * (3 + round))));
  const L = leftItems.reduce((s, t) => s + t.w, 0);
  const ns = 2 + Math.floor(Math.random() * 2);
  const sol = [];
  let rest = L;
  for (let i = 0; i < ns - 1; i++){
    const w = Math.max(1, Math.min(rest - (ns - 1 - i), 1 + Math.floor(Math.random() * (rest - 1))));
    sol.push(item(w)); rest -= w;
  }
  sol.push(item(rest));
  const decoys = Array.from({length: 3}, () => item(1 + Math.floor(Math.random() * 8)));
  tray = [...sol, ...decoys].sort(() => Math.random() - .5);
  right = [];
  render();
}
function fontFor(w){ return (24 + w * 5) + "px"; }
function grams(w){ return (w * 100) + "g"; }
function tteokEl(t, tag){
  const s = document.createElement(tag);
  s.className = "t";
  s.innerHTML = `${face(t.ei, parseInt(fontFor(t.w)))}<small>${grams(t.w)}</small>`;
  return s;
}
function render(){
  const pl = $("pan-left"), pr = $("pan-right"), tr = $("tray");
  pl.innerHTML = ""; pr.innerHTML = ""; tr.innerHTML = "";
  for (const t of leftItems) pl.appendChild(tteokEl(t, "span"));
  for (const t of right){
    const s = tteokEl(t, "span");
    s.title = "내리기";
    s.addEventListener("click", () => { if (!playing) return; right = right.filter(x => x.id !== t.id); tray.push(t); render(); });
    pr.appendChild(s);
  }
  for (const t of tray){
    const b = document.createElement("button");
    b.innerHTML = `${face(t.ei, parseInt(fontFor(t.w)))}<br><small>${grams(t.w)}</small>`;
    b.addEventListener("click", () => { if (!playing) return; tray = tray.filter(x => x.id !== t.id); right.push(t); render(); });
    tr.appendChild(b);
  }
  tilt();
}
function tilt(){
  const L = leftItems.reduce((s, t) => s + t.w, 0);
  const R = right.reduce((s, t) => s + t.w, 0);
  const diff = L - R;
  $("totals").innerHTML = `<span>왼쪽 ${L * 100}g</span><span>오른쪽 ${R * 100}g</span>` +
    (diff === 0 && right.length ? `<span class="ok">수평!</span>`
      : diff > 0 ? `<span class="diff">${diff * 100}g 모자라요</span>`
      : diff < 0 ? `<span class="diff">${-diff * 100}g 넘쳤어요</span>` : "");
  const ang = Math.max(-14, Math.min(14, diff * 3)); // 왼쪽이 무거우면 왼쪽으로 기움
  $("beam").style.transform = `rotate(${-ang}deg)`;
  document.querySelectorAll(".pan").forEach(p => p.style.transform = `rotate(${ang}deg)`);
  if (playing && right.length && L === R){
    playing = false;
    $("beam").classList.add("level-flash");
    $("hint").textContent = "✨ 수평! 완벽한 떡시루!";
    setTimeout(() => {
      if (ended) return; // 연출 중 게임이 이미 끝났으면 좀비 라운드 방지
      $("beam").classList.remove("level-flash");
      $("hint").textContent = "왼쪽 시루와 수평이 되게, 아래 떡을 골라 오른쪽 시루에 올려요!";
      round++;
      if (round > 5) return end(true);
      if (time <= 0) return end(false); // 연출 중 시간이 다 됐으면 클리어만 반영하고 종료
      playing = true;
      newRound();
    }, 1300);
  }
}
function end(cleared){
  if (ended) return;
  ended = true;
  playing = false;
  clearInterval(tick);
  $("ov-title").textContent = cleared ? "🏆 떡시루 균형왕!" : "⏰ 끝!";
  $("ov-sub").textContent = cleared ? `5판 모두 수평 성공! (남은 시간 ${time}초)` : `${round - 1}판까지 수평 성공!`;
  document.querySelector("#overlay button").textContent = "다시 하기";
  $("overlay").classList.remove("hide");
}
</script>
</body>
</html>
