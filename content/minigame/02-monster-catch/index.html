<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>몬스터 잡기</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:"Pretendard","Noto Sans KR","Malgun Gothic",sans-serif; user-select:none; }
html,body { width:100%; height:100%; overflow:hidden; }
body { background:#E8F6EF; display:flex; flex-direction:column; align-items:center; }
header { display:flex; gap:36px; padding:14px; font-size:26px; font-weight:800; color:#2f5d47; }
#grid { flex:1; display:grid; grid-template-columns:repeat(3, 160px); grid-auto-rows:160px;
  gap:22px; align-content:center; }
.hole { border:none; border-radius:50%; background:#bfe3d0; box-shadow:inset 0 8px 14px rgba(0,0,0,.18);
  font-size:84px; cursor:pointer; color:transparent; transition:background .1s; }
.hole.up { color:inherit; background:#fff; }
.hole.bonk { background:#ffd9d0; }
#overlay { position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex;
  align-items:center; justify-content:center; flex-direction:column; gap:18px; color:#fff; }
#overlay.hide { display:none; }
#overlay h1 { font-size:54px; }
#overlay button { font-size:30px; font-weight:800; padding:18px 44px; border:none;
  border-radius:16px; background:#F5573B; color:#fff; cursor:pointer; }
</style>
</head>
<body>
<header><span>🔨 몬스터 잡기</span><span id="time">30초</span><span id="score">0점</span></header>
<div id="grid"></div>
<div id="overlay"><h1 id="ov-title">몬스터 잡기</h1><p id="ov-sub" style="font-size:26px">튀어나오는 몬스터를 클릭하세요!</p><button onclick="start()">시작!</button></div>
<script>
"use strict";
const EMOJIS = ["🐰","🌕","🍡","🥮","🍚","🧺"]; // 떡집 테마
const grid = document.getElementById("grid");
const holes = [];
for (let i = 0; i < 9; i++){
  const b = document.createElement("button");
  b.className = "hole"; b.textContent = "🐙";
  b.addEventListener("click", () => bonk(b));
  grid.appendChild(b); holes.push(b);
}
let score = 0, time = 30, popTimer = null, tickTimer = null, playing = false;

function start(){
  document.getElementById("overlay").classList.add("hide");
  score = 0; time = 30; playing = true;
  update();
  tickTimer = setInterval(() => {
    time--; update();
    if (time <= 0) end();
  }, 1000);
  pop();
}
function update(){
  document.getElementById("time").textContent = `${time}초`;
  document.getElementById("score").textContent = `${score}점`;
}
function pop(){
  if (!playing) return;
  holes.forEach(h => h.classList.remove("up"));
  const n = Math.random() < .25 ? 2 : 1; // 가끔 2마리
  for (let i = 0; i < n; i++){
    const h = holes[Math.floor(Math.random() * holes.length)];
    h.textContent = EMOJIS[Math.floor(Math.random() * EMOJIS.length)];
    h.classList.add("up");
  }
  const delay = Math.max(500, 950 - score * 12); // 점수 오르면 점점 빨라짐
  popTimer = setTimeout(pop, delay);
}
function bonk(h){
  if (!playing || !h.classList.contains("up")) return;
  score++; update();
  h.classList.remove("up"); h.classList.add("bonk");
  setTimeout(() => h.classList.remove("bonk"), 150);
}
function end(){
  playing = false;
  clearInterval(tickTimer); clearTimeout(popTimer);
  holes.forEach(h => h.classList.remove("up"));
  document.getElementById("ov-title").textContent = "⏰ 끝!";
  document.getElementById("ov-sub").textContent = `${score}마리를 잡았어요!`;
  document.querySelector("#overlay button").textContent = "다시 하기";
  document.getElementById("overlay").classList.remove("hide");
}
</script>
</body>
</html>
