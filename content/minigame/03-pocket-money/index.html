<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>용돈 일주일 인생게임</title>
<style>
/* 브랜드 서체: esamanru — /kiosk/fonts/ 의 woff2 교체로 변경 */
@font-face { font-family:"esamanru"; font-weight:300; font-display:swap; src:url("/kiosk/fonts/esamanru-light.woff2") format("woff2"); }
@font-face { font-family:"esamanru"; font-weight:400 600; font-display:swap; src:url("/kiosk/fonts/esamanru-medium.woff2") format("woff2"); }
@font-face { font-family:"esamanru"; font-weight:700 900; font-display:swap; src:url("/kiosk/fonts/esamanru-bold.woff2") format("woff2"); }

/* 용돈관리 인생게임 압축판 — 캐릭터(시작 조건) 선택 → 8일 에피소드 선택 →
 * 정산 + 등급 + 마무리 퀴즈. 선택이 뒤 에피소드에 영향(플래그 분기), 잔액 부족 비활성화. */
* { margin:0; padding:0; box-sizing:border-box; font-family:"esamanru","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif; user-select:none; }
html,body { width:100%; height:100%; overflow:hidden; }
body { background:#FFF9EF; display:flex; }
#side { width:190px; background:#F6EEDF; padding:16px 12px; display:flex; flex-direction:column; gap:10px; }
.stat { background:#fff; border-radius:14px; padding:10px 14px; box-shadow:0 3px 0 rgba(0,0,0,.08); }
.stat small { font-size:14px; font-weight:700; color:#8a6d4f; display:block; }
.stat b { font-size:26px; color:#3d2723; }
#main { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:16px; gap:14px; }
#day-badge { align-self:stretch; display:flex; justify-content:space-between; background:#7E212F; color:#F2C744;
  border-radius:14px 14px 0 0; padding:10px 18px; font-size:20px; font-weight:800; }
#card { align-self:stretch; background:#fff; border-radius:0 0 18px 18px; padding:22px 26px 26px;
  box-shadow:0 8px 24px rgba(0,0,0,.1); display:flex; flex-direction:column; gap:16px; flex:1; overflow:auto; }
#ep-title { text-align:center; font-size:34px; font-weight:900; color:#1fae8e; }
#ep-desc { text-align:center; font-size:20px; color:#5a4a3a; }
.choice { display:flex; align-items:center; gap:16px; border:none; background:#FBF6EC; border-radius:16px;
  padding:14px 20px; cursor:pointer; font-size:22px; font-weight:800; color:#3d2723; text-align:left;
  box-shadow:0 3px 0 rgba(0,0,0,.08); }
.choice:hover { background:#F5E9D2; }
.choice:active { transform:translateY(2px); }
.choice .c-emoji { font-size:34px; }
.choice .c-fx { margin-left:auto; font-size:17px; font-weight:800; color:#1fae8e; white-space:nowrap; }
.choice .c-fx.bad { color:#c0392b; }
.choice:disabled { opacity:.45; cursor:default; }
.choice:disabled .c-fx { color:#c0392b; }
#overlay { position:fixed; inset:0; background:rgba(43,30,25,.65); display:flex; z-index:5; overflow:auto;
  align-items:center; justify-content:center; }
#overlay.hide { display:none; }
#ov-card { background:#FFF9EF; border-radius:22px; padding:30px 40px; max-width:640px; width:92%;
  display:flex; flex-direction:column; gap:14px; align-items:center; text-align:center; }
#ov-card h1 { font-size:38px; color:#7E212F; }
#ov-card .sub { font-size:19px; color:#5a4a3a; }
.char-row, .quiz-row { display:flex; gap:14px; flex-wrap:wrap; justify-content:center; }
.char-row button, .quiz-row button { border:none; background:#fff; border-radius:16px; padding:16px 18px;
  cursor:pointer; font-size:19px; font-weight:800; color:#3d2723; box-shadow:0 4px 0 rgba(0,0,0,.1);
  display:flex; flex-direction:column; gap:6px; align-items:center; min-width:150px; }
.char-row .big { font-size:44px; }
.char-row small { font-weight:600; color:#8a6d4f; }
#score-table { background:#fff; border-radius:14px; padding:14px 22px; width:100%; font-size:19px; }
#score-table div { display:flex; justify-content:space-between; padding:4px 0; font-weight:700; }
#grade { font-size:34px; font-weight:900; color:#1fae8e; }
.primary { background:#7E212F !important; color:#F2C744 !important; }
</style>
</head>
<body>
<div id="side">
  <div class="stat"><small>💰 잔액</small><b id="s-money">-</b></div>
  <div class="stat"><small>😊 행복</small><b id="s-happy">0</b></div>
  <div class="stat"><small>😟 불행</small><b id="s-sad">0</b></div>
  <div class="stat"><small>❤️ 호감</small><b id="s-love">0</b></div>
</div>
<div id="main">
  <div id="day-badge"><span id="d-date">1일차</span><span id="d-allow"></span></div>
  <div id="card">
    <div id="ep-title"></div>
    <div id="ep-desc"></div>
    <div id="choices" style="display:flex;flex-direction:column;gap:12px"></div>
  </div>
</div>
<div id="overlay"><div id="ov-card"></div></div>
<script>
"use strict";
const $ = id => document.getElementById(id);
const CHARS = [
  { name:"아롱", emoji:"🐰", base:12, daily:0, desc:"기본 12만 · 매일 0원" },
  { name:"다솜", emoji:"🐹", base:6,  daily:1, desc:"기본 6만 · 매일 1만" },
  { name:"초코", emoji:"🐻", base:0,  daily:2, desc:"기본 0원 · 매일 2만" },
];
/* 이미지 슬롯: assets/캐릭터1~3.png — 있으면 이모지 대신 */
CHARS.forEach((c, i) => {
  const im = new Image();
  im.src = `assets/캐릭터${i + 1}.png`;
  im.onload = () => { c.img = im.src; };
});
let st = null;

/* 에피소드 — cost(만원), fx:{h행복 u불행 l호감}, flag 획득, need 조건부 노출 */
const EPISODES = [
  { t:"저녁 먹기", d:"용돈이 생기니 맛있는 게 먹고 싶다!", c:[
    { e:"🍔", n:"햄버거 세트", cost:3, fx:{h:4} },
    { e:"🍜", n:"분식집 떡볶이", cost:2, fx:{h:2} },
    { e:"❌", n:"참는다", cost:0, fx:{u:1} } ]},
  { t:"취미 생활", d:"좋아하는 취미생활에 필요한 것이 있어!", c:[
    { e:"🎮", n:"게임 스킨", cost:9, fx:{h:6} },
    { e:"🎨", n:"미술 도구", cost:2, fx:{h:3}, flag:"art" },
    { e:"🏸", n:"배드민턴 채", cost:7, fx:{h:5}, flag:"racket" } ]},
  { t:"준비물", d:"학교 미술시간에 준비물이 필요하대 ㅠㅠ", c:[
    { e:"🎨", n:"이미 샀으니 가져간다", cost:0, fx:{h:2}, need:"art", tag:"다행이다!" },
    { e:"🏪", n:"문구점에서 산다", cost:2, fx:{}, hideIf:"art" },
    { e:"❌", n:"안 사고 혼난다", cost:0, fx:{u:3}, hideIf:"art" } ]},
  { t:"친구 생일", d:"단짝 친구의 생일이야!", c:[
    { e:"🎁", n:"선물 준비", cost:3, fx:{l:5} },
    { e:"💌", n:"정성껏 손편지", cost:0, fx:{l:2} },
    { e:"🙈", n:"모른 척한다", cost:0, fx:{u:2} } ]},
  { t:"간식 시간", d:"쉬는 시간, 매점 냄새가 솔솔~", c:[
    { e:"🍡", n:"떡꼬치 사서 나눠 먹기", cost:2, fx:{h:2,l:3} },
    { e:"🍫", n:"혼자 초코바", cost:1, fx:{h:2} },
    { e:"❌", n:"참는다", cost:0, fx:{u:1} } ]},
  { t:"주말 운동회", d:"동네 배드민턴 대회가 열렸다!", c:[
    { e:"🏆", n:"내 채로 출전! 우승 도전", cost:0, fx:{h:5,l:3}, need:"racket", tag:"준비된 자!" },
    { e:"🏸", n:"채 빌려서 참가", cost:1, fx:{h:2}, hideIf:"racket" },
    { e:"📺", n:"집에서 구경", cost:0, fx:{} } ]},
  { t:"가족의 날", d:"내일은 부모님 기념일! 뭔가 하고 싶다.", c:[
    { e:"💐", n:"꽃 + 선물", cost:4, fx:{l:6} },
    { e:"🌹", n:"카네이션 한 송이", cost:1, fx:{l:3} },
    { e:"📝", n:"마음만 전한다", cost:0, fx:{l:1} } ]},
  { t:"마지막 날", d:"일주일이 끝났다. 남은 용돈은 어떻게 할까?", c:[
    { e:"🏦", n:"저금통에 쏙!", cost:0, fx:{h:2}, tag:"미래를 위해!" },
    { e:"🛍", n:"오늘 다 쓴다!", cost:0, fx:{h:1,u:1}, spendAll:true } ]},
];
const QUIZ = { q:"용돈을 잘 관리하려면 매일 무엇을 쓰면 좋을까요? (힌트: ㅇㄷㄱㅇㅈ)",
  a:["용돈기입장","오디오일지","우동가입증","이동경위서"], ans:0 };

function start(){
  const ov = $("ov-card");
  ov.innerHTML = `<h1>💰 용돈 일주일 인생게임</h1>
    <p class="sub">일주일 동안 주어진 용돈으로 현명하게 소비하고<br><b>행복지수</b>를 높여 보세요!<br>누구로 시작할까요?</p>
    <div class="char-row"></div>`;
  const row = ov.querySelector(".char-row");
  CHARS.forEach(c => {
    const b = document.createElement("button");
    b.innerHTML = (c.img ? `<img src="${c.img}" style="height:96px" draggable="false">`
                         : `<span class="big">${c.emoji}</span>`) +
      `<span>${c.name}</span><small>${c.desc}</small>`;
    b.addEventListener("click", () => begin(c));
    row.appendChild(b);
  });
  $("overlay").classList.remove("hide");
}
function begin(c){
  st = { money:c.base, daily:c.daily, happy:0, sad:0, love:0, day:1, flags:new Set() };
  $("overlay").classList.add("hide");
  showDay();
}
function hud(){
  $("s-money").textContent = st.money + "만";
  $("s-happy").textContent = st.happy;
  $("s-sad").textContent = st.sad;
  $("s-love").textContent = st.love;
  $("d-date").textContent = `${st.day}일차 / ${EPISODES.length}일`;
  $("d-allow").textContent = st.daily ? `아침 용돈 +${st.daily}만` : "";
}
function fxText(c){
  const parts = [];
  if (c.fx.h) parts.push(`행복 +${c.fx.h}`);
  if (c.fx.l) parts.push(`호감 +${c.fx.l}`);
  if (c.fx.u) parts.push(`불행 +${c.fx.u}`); // 복합 효과도 전부 표시 (표기≡실제 효과)
  if (c.tag) parts.push(c.tag);
  return { text: parts.join(" · ") || "-", bad: !!c.fx.u && !c.fx.h && !c.fx.l };
}
function showDay(){
  if (st.daily) st.money += st.daily;
  hud();
  const ep = EPISODES[st.day - 1];
  $("ep-title").textContent = ep.t;
  $("ep-desc").textContent = ep.d;
  const box = $("choices");
  box.innerHTML = "";
  for (const c of ep.c){
    if (c.need && !st.flags.has(c.need)) continue;
    if (c.hideIf && st.flags.has(c.hideIf)) continue;
    const b = document.createElement("button");
    b.className = "choice";
    const fx = fxText(c);
    const afford = st.money >= c.cost;
    b.innerHTML = `<span class="c-emoji">${c.e}</span><span>${c.n} (${c.cost ? c.cost + "만원" : "0원"})</span>
      <span class="c-fx ${fx.bad ? "bad" : ""}">${afford ? fx.text : "잔액 부족"}</span>`;
    if (!afford) b.disabled = true;
    else b.addEventListener("click", () => pick(c));
    box.appendChild(b);
  }
}
function pick(c){
  st.money -= c.cost;
  if (c.spendAll) st.money = 0;
  st.happy += c.fx.h || 0;
  st.sad += c.fx.u || 0;
  st.love += c.fx.l || 0;
  if (c.flag) st.flags.add(c.flag);
  st.day++;
  hud();
  if (st.day > EPISODES.length) finale();
  else showDay();
}
function finale(){
  const asset = st.money * 2, happy = st.happy * 10, sad = st.sad * 15, love = st.love * 10;
  const score = asset + happy + love - sad;
  const grade = score >= 160 ? "💎 소비의 신" : score >= 110 ? "🥇 알뜰살뜰 고수"
    : score >= 60 ? "🥈 무난한 일주일" : "🥉 다음엔 아껴 보자!";
  const ov = $("ov-card");
  ov.innerHTML = `<h1>🎉 게임 종료!</h1><p class="sub">일주일 동안 수고했어요. 최종 잔액 <b>${st.money}만원</b></p>
    <div id="score-table">
      <div><span>💰 자산 점수</span><span>+${asset}</span></div>
      <div><span>😊 행복 점수</span><span>+${happy}</span></div>
      <div><span>❤️ 호감 점수</span><span>+${love}</span></div>
      <div><span>😟 불행 감점</span><span>-${sad}</span></div>
      <div style="border-top:2px solid #eee"><span>최종 점수</span><span><b>${score}점</b></span></div>
    </div>
    <div id="grade">${grade}</div>
    <p class="sub" style="margin-top:8px">📖 <b>마무리 퀴즈</b><br>${QUIZ.q}</p>
    <div class="quiz-row"></div>`;
  const row = ov.querySelector(".quiz-row");
  QUIZ.a.forEach((a, i) => {
    const b = document.createElement("button");
    b.textContent = a;
    b.addEventListener("click", () => {
      if (i === QUIZ.ans){
        row.innerHTML = `<p class="sub">⭕ 정답! <b>용돈기입장</b>을 쓰면 돈의 흐름이 보여요!</p>
          <button class="primary" style="font-size:22px;padding:14px 30px" onclick="start()">다시 하기</button>`;
      } else {
        b.disabled = true; b.style.opacity = .4;
      }
    });
    row.appendChild(b);
  });
  $("overlay").classList.remove("hide");
}
start();
</script>
</body>
</html>
