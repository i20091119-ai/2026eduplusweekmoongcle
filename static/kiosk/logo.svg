<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- 뭉클 떡집 로고 (SVG 재현판) — 디자인팀 원본 이미지로 교체 가능 -->
  <rect x="6" y="6" width="188" height="188" rx="44" fill="#7E212F"/>
  <circle cx="100" cy="100" r="74" fill="#F2C744"/>
  <g fill="#54210F">
    <!-- 절구 -->
    <path d="M52 122 h44 l-5 40 h-34 z"/>
    <rect x="48" y="116" width="52" height="10" rx="5"/>
    <!-- 절굿공이 -->
    <g transform="rotate(38 118 92)">
      <rect x="112" y="38" width="13" height="66" rx="6"/>
      <ellipse cx="118.5" cy="36" rx="11" ry="9"/>
    </g>
    <!-- 토끼 몸 -->
    <ellipse cx="124" cy="132" rx="26" ry="32"/>
    <!-- 머리 -->
    <circle cx="118" cy="88" r="20"/>
    <!-- 귀 -->
    <path d="M108 74 C100 44 108 34 114 34 C120 34 122 52 118 72 Z"/>
    <path d="M126 72 C130 40 140 30 146 34 C152 38 144 58 134 76 Z"/>
    <!-- 앞발 (공이 잡은 손) -->
    <circle cx="103" cy="103" r="8"/>
    <!-- 뒷발 -->
    <ellipse cx="112" cy="163" rx="10" ry="6"/>
    <ellipse cx="138" cy="163" rx="10" ry="6"/>
    <!-- 꼬리 -->
    <circle cx="150" cy="140" r="8"/>
  </g>
</svg>
