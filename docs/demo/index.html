<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>뭉클 부스 키오스크 데모</title>
<meta name="viewport" content="width=1280">
<style>
/* 뭉클 떡집 키오스크 — 기준 1280×720, 대형 글자·대형 버튼 (설계명세서 2.3)
 * 팔레트: 떡집 브랜드 (버건디 · 달 노랑 · 하늘색 · 크림) — 디자인팀 시안 기준 */
:root {
  --brand: #7E212F;        /* 버건디 — 간판·번호블록 */
  --brand-dark: #5e1722;
  --moon: #F2C744;         /* 달 노랑 — 포인트 */
  --ink: #3d2723;          /* 진갈색 글자 */
  --bg: #ACD6E8;           /* 하늘색 바탕 */
  --card: #FFF9EF;         /* 크림 카드 */
}
* { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
html, body { width: 100%; height: 100%; overflow: hidden; }
body {
  font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif;
  background: var(--bg); color: var(--ink);
  cursor: default; /* 트랙볼 커서 표시 유지 */
}
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; }
.hidden { display: none !important; }

/* 버튼 — 클릭 타깃 2cm 이상 */
button {
  font-family: inherit; border: none; border-radius: 18px;
  cursor: pointer; color: var(--ink); background: var(--card);
  box-shadow: 0 4px 0 rgba(0,0,0,.12);
}
button:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.12); }
.btn-huge { font-size: 44px; font-weight: 800; padding: 28px 70px; background: var(--brand); color: #fff; }
.btn-big  { font-size: 26px; font-weight: 700; padding: 18px 30px; min-width: 120px; min-height: 76px; }
.btn-primary { background: var(--brand); color: #fff; }
.pulse { animation: pulse 1.6s infinite; }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }

/* ① 어트랙트 — 떡집 간판 무드 */
#screen-attract { align-items: center; justify-content: center; text-align: center;
  background: radial-gradient(circle at 50% 28%, #cde8f4 0%, var(--bg) 70%); }
.attract-logo-row { display: flex; align-items: center; justify-content: center; gap: 20px; }
.attract-logo { font-size: 88px; font-weight: 900; color: var(--ink); letter-spacing: 4px;
  text-shadow: 3px 3px 0 rgba(0,0,0,.15); }
.logo-badge { width: 110px; height: 110px; }
.attract-bubbles { display: flex; gap: 10px; justify-content: center; margin-bottom: 16px; }
.attract-bubbles span { background: #fff; border-radius: 999px; padding: 8px 16px;
  font-size: 22px; font-weight: 800; color: var(--ink); box-shadow: 0 3px 0 rgba(0,0,0,.12); }
#screen-attract h1 { font-size: 44px; line-height: 1.35; margin: 20px 0 44px; }
.attract-hint { margin-top: 28px; font-size: 22px; color: #4c6b7d; }

/* 공통 헤더/푸터 */
.step-header { font-size: 34px; font-weight: 800; padding: 26px 40px; }
.step-badge { background: var(--brand); color: #fff; border-radius: 12px;
  padding: 6px 18px; font-size: 26px; margin-right: 14px; }
.nav-row { display: flex; gap: 20px; align-items: center; justify-content: center; padding: 22px; }
.dots { font-size: 26px; letter-spacing: 6px; color: var(--brand); min-width: 120px; text-align: center; }

/* ② 소개 */
.intro-stage { flex: 1; display: flex; align-items: center; justify-content: center; padding: 0 40px; }
#intro-img { max-width: 100%; max-height: 100%; border-radius: 16px;
  box-shadow: 0 10px 30px rgba(0,0,0,.15); background: #fff; }
.intro-empty { font-size: 34px; color: #999; }

/* ③ 코드 입력 */
.code-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; }
.code-display { display: flex; gap: 18px; }
.code-display .digit {
  width: 90px; height: 110px; background: var(--card); border-radius: 16px;
  border: 4px solid var(--moon); font-size: 64px; font-weight: 900;
  display: flex; align-items: center; justify-content: center;
}
.code-display.error .digit { border-color: var(--brand); animation: shake .4s; }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-12px)} 75%{transform:translateX(12px)} }
.keypad { display: grid; grid-template-columns: repeat(3, 110px); gap: 14px; }
.keypad button { font-size: 40px; font-weight: 800; height: 86px; }
.keypad .key-del { font-size: 30px; background: #f3e2c8; }
.code-msg { font-size: 24px; color: #35505f; min-height: 32px; }
.code-msg.ok { color: #2e9e44; font-weight: 800; }
.code-msg.bad { color: var(--brand); font-weight: 800; }

/* ④ 도안 만들기 */
.maker-body { flex: 1; display: flex; flex-direction: column; align-items: center;
  gap: 22px; padding: 10px 50px 30px; overflow: auto; }
/* 내용이 넘칠 때도 클리핑 없이 세로 중앙 정렬 */
.maker-body > :first-child { margin-top: auto; }
.maker-body > :last-child { margin-bottom: auto; }
.maker-menu { display: flex; gap: 26px; flex-wrap: wrap; justify-content: center; }
.maker-menu button { width: 340px; min-height: 210px; font-size: 30px; font-weight: 800;
  display: flex; flex-direction: column; gap: 10px; align-items: center; justify-content: center;
  border: 4px solid transparent; }
.maker-menu button:hover { border-color: var(--brand); }
.maker-menu .m-emoji { font-size: 64px; }
.maker-menu .m-desc { font-size: 20px; font-weight: 500; color: #8a7a6a; }
.maker-q { font-size: 38px; font-weight: 800; text-align: center; line-height: 1.4; max-width: 1000px; }
.maker-progress { font-size: 22px; font-weight: 700; color: #a08a76; }
.maker-choices { display: flex; gap: 30px; flex-wrap: wrap; justify-content: center; }
.maker-choices button { min-width: 300px; max-width: 480px; min-height: 130px;
  font-size: 30px; font-weight: 800; padding: 20px 30px;
  display: flex; flex-direction: column; gap: 8px; align-items: center; justify-content: center;
  border: 4px solid transparent; }
.maker-choices button:hover { border-color: var(--brand); }
.maker-choices .c-emoji { font-size: 58px; }
.vs-badge { font-size: 40px; font-weight: 900; color: var(--brand); align-self: center; }
.maker-result-emoji { font-size: 120px; }
.maker-result-name { font-size: 52px; font-weight: 900; color: var(--brand); }
.maker-result-line { font-size: 26px; color: #7a6a5c; }
.dosan-grid { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; }
.dosan-grid button { font-size: 28px; font-weight: 800; padding: 26px 34px;
  min-width: 220px; min-height: 110px; border: 4px solid transparent; }
.dosan-grid button:hover { border-color: var(--brand); }

/* ⑤ 인쇄 중 / ⑦ 호출 공용 */
.center-box { flex: 1; display: flex; flex-direction: column; align-items: center;
  justify-content: center; text-align: center; gap: 22px; }
.center-box h1 { font-size: 52px; }
.spinner { width: 90px; height: 90px; border: 12px solid #eee;
  border-top-color: var(--brand); border-radius: 50%; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ⑥ 대기 */
.wait-banner { display: flex; align-items: center; gap: 22px;
  background: var(--brand); color: #fff; padding: 18px 30px; font-size: 26px; }
.wait-number { background: #fff; color: var(--brand); font-weight: 900;
  font-size: 32px; border-radius: 12px; padding: 8px 20px; }
.wait-tabs { display: flex; gap: 14px; padding: 16px 30px 0; }
.tab { font-size: 26px; font-weight: 700; padding: 16px 34px; background: #cfe6f1; }
.tab.active { background: var(--card); box-shadow: 0 4px 0 var(--moon); }
/* 미니게임 메뉴 — 8종 = 4열 × 2줄 */
.game-menu { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px;
  align-content: center; padding: 16px 36px; overflow: auto; }
.game-menu button {
  min-height: 168px; font-size: 24px; font-weight: 800; padding: 12px 8px;
  display: flex; flex-direction: column; gap: 6px; align-items: center; justify-content: center;
}
.game-menu .g-emoji { font-size: 48px; }
.game-menu .g-desc { font-size: 16px; font-weight: 500; color: #8a7a6a; padding: 0 6px; text-align: center; }
.game-frame-wrap { flex: 1; display: flex; flex-direction: column; padding: 12px 20px 20px; gap: 10px; }
.btn-exit { align-self: flex-start; min-height: 60px; padding: 10px 24px; font-size: 22px; }
#game-frame { flex: 1; width: 100%; border: none; border-radius: 16px; background: #fff;
  box-shadow: 0 6px 20px rgba(0,0,0,.12); }
.wait-intro { flex: 1; display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 10px; padding: 16px; }
#wait-intro-img { max-height: 420px; max-width: 92%; border-radius: 14px; background: #fff;
  box-shadow: 0 6px 20px rgba(0,0,0,.12); }

/* ⑦ 호출 */
.called { background: var(--brand); color: #fff; z-index: 50; }
.called .accent { color: #ffe27a; }
.called-title { font-size: 110px !important; }
.called-sub { font-size: 40px; font-weight: 800; }
.called h2 { font-size: 48px; }
.bell { font-size: 120px; animation: ring .8s infinite; transform-origin: top center; }
@keyframes ring { 0%,100%{transform:rotate(0)} 25%{transform:rotate(18deg)} 75%{transform:rotate(-18deg)} }


/* 데모 조작부 — 실제 부스 화면에는 없음 */
#demo-bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 200;
  display: flex; gap: 12px; align-items: center; justify-content: center;
  padding: 8px; background: rgba(43,43,43,.92); }
#demo-bar .demo-chip { color: #ffd97a; font-size: 15px; }
#demo-bar button { font-size: 16px; font-weight: 700; padding: 10px 20px;
  border-radius: 10px; background: #7E212F; color: #F2C744; box-shadow: none; }
.screen { bottom: 48px !important; }
#screen-called.screen { bottom: 0 !important; }

</style>
</head>
<body>
<!-- 기준 해상도 1280×720 · 트랙볼 클릭 전용 · 클릭 타깃 2cm 이상 -->

<!-- ① 어트랙트 -->
<section id="screen-attract" class="screen">
  <div class="attract-inner">
    <div class="attract-bubbles"><span>콘!</span><span>텐!</span><span>츠!</span><span>맛!</span><span>집!</span></div>
    <div class="attract-logo-row">
      <span class="attract-logo">뭉클</span>
      <img src="data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20200%20200%22%3E%0A%20%20%3C%21--%20%EB%AD%89%ED%81%B4%20%EB%96%A1%EC%A7%91%20%EB%A1%9C%EA%B3%A0%20%28SVG%20%EC%9E%AC%ED%98%84%ED%8C%90%29%20%E2%80%94%20%EB%94%94%EC%9E%90%EC%9D%B8%ED%8C%80%20%EC%9B%90%EB%B3%B8%20%EC%9D%B4%EB%AF%B8%EC%A7%80%EB%A1%9C%20%EA%B5%90%EC%B2%B4%20%EA%B0%80%EB%8A%A5%20--%3E%0A%20%20%3Crect%20x%3D%226%22%20y%3D%226%22%20width%3D%22188%22%20height%3D%22188%22%20rx%3D%2244%22%20fill%3D%22%237E212F%22/%3E%0A%20%20%3Ccircle%20cx%3D%22100%22%20cy%3D%22100%22%20r%3D%2274%22%20fill%3D%22%23F2C744%22/%3E%0A%20%20%3Cg%20fill%3D%22%2354210F%22%3E%0A%20%20%20%20%3C%21--%20%EC%A0%88%EA%B5%AC%20--%3E%0A%20%20%20%20%3Cpath%20d%3D%22M52%20122%20h44%20l-5%2040%20h-34%20z%22/%3E%0A%20%20%20%20%3Crect%20x%3D%2248%22%20y%3D%22116%22%20width%3D%2252%22%20height%3D%2210%22%20rx%3D%225%22/%3E%0A%20%20%20%20%3C%21--%20%EC%A0%88%EA%B5%BF%EA%B3%B5%EC%9D%B4%20--%3E%0A%20%20%20%20%3Cg%20transform%3D%22rotate%2838%20118%2092%29%22%3E%0A%20%20%20%20%20%20%3Crect%20x%3D%22112%22%20y%3D%2238%22%20width%3D%2213%22%20height%3D%2266%22%20rx%3D%226%22/%3E%0A%20%20%20%20%20%20%3Cellipse%20cx%3D%22118.5%22%20cy%3D%2236%22%20rx%3D%2211%22%20ry%3D%229%22/%3E%0A%20%20%20%20%3C/g%3E%0A%20%20%20%20%3C%21--%20%ED%86%A0%EB%81%BC%20%EB%AA%B8%20--%3E%0A%20%20%20%20%3Cellipse%20cx%3D%22124%22%20cy%3D%22132%22%20rx%3D%2226%22%20ry%3D%2232%22/%3E%0A%20%20%20%20%3C%21--%20%EB%A8%B8%EB%A6%AC%20--%3E%0A%20%20%20%20%3Ccircle%20cx%3D%22118%22%20cy%3D%2288%22%20r%3D%2220%22/%3E%0A%20%20%20%20%3C%21--%20%EA%B7%80%20--%3E%0A%20%20%20%20%3Cpath%20d%3D%22M108%2074%20C100%2044%20108%2034%20114%2034%20C120%2034%20122%2052%20118%2072%20Z%22/%3E%0A%20%20%20%20%3Cpath%20d%3D%22M126%2072%20C130%2040%20140%2030%20146%2034%20C152%2038%20144%2058%20134%2076%20Z%22/%3E%0A%20%20%20%20%3C%21--%20%EC%95%9E%EB%B0%9C%20%28%EA%B3%B5%EC%9D%B4%20%EC%9E%A1%EC%9D%80%20%EC%86%90%29%20--%3E%0A%20%20%20%20%3Ccircle%20cx%3D%22103%22%20cy%3D%22103%22%20r%3D%228%22/%3E%0A%20%20%20%20%3C%21--%20%EB%92%B7%EB%B0%9C%20--%3E%0A%20%20%20%20%3Cellipse%20cx%3D%22112%22%20cy%3D%22163%22%20rx%3D%2210%22%20ry%3D%226%22/%3E%0A%20%20%20%20%3Cellipse%20cx%3D%22138%22%20cy%3D%22163%22%20rx%3D%2210%22%20ry%3D%226%22/%3E%0A%20%20%20%20%3C%21--%20%EA%BC%AC%EB%A6%AC%20--%3E%0A%20%20%20%20%3Ccircle%20cx%3D%22150%22%20cy%3D%22140%22%20r%3D%228%22/%3E%0A%20%20%3C/g%3E%0A%3C/svg%3E%0A" class="logo-badge" alt="뭉클 떡집 로고">
      <span class="attract-logo">떡집</span>
    </div>
    <h1>달토끼와 떡 몬스터가 차린<br>나만의 클리커 만들기</h1>
    <button id="btn-start" class="btn-huge pulse">시작하기 ▶</button>
    <p class="attract-hint">화면의 버튼을 트랙볼로 클릭하세요</p>
    <button id="btn-attract-intro" class="btn-big" style="margin-top:14px">📖 뭉클 알아보기</button>
  </div>
</section>

<!-- ② 뭉클 알아보기 (소개 슬라이드) -->
<section id="screen-intro" class="screen hidden">
  <header class="step-header">
    <span class="step-badge">1단계</span> 뭉클 알아보기
  </header>
  <div class="intro-stage">
    <img id="intro-img" alt="뭉클 소개">
    <div id="intro-empty" class="intro-empty hidden">소개자료 준비 중이에요!</div>
  </div>
  <footer class="nav-row">
    <button id="btn-intro-prev" class="btn-big">◀ 이전</button>
    <span id="intro-dots" class="dots"></span>
    <button id="btn-intro-next" class="btn-big">다음 ▶</button>
    <button id="btn-to-code" class="btn-big btn-primary">코드 입력하러 가기 ✔</button>
  </footer>
</section>

<!-- ③ 코드 입력 (숫자 키패드) -->
<section id="screen-code" class="screen hidden">
  <header class="step-header">
    <span class="step-badge">2단계</span> <span id="code-title">몬스터가 알려준 코드를 입력하세요</span>
  </header>
  <div class="code-wrap">
    <div id="code-display" class="code-display"></div>
    <div id="keypad" class="keypad"></div>
    <p id="code-msg" class="code-msg">스마트폰으로 몬스터에 접촉해 퀴즈를 풀면 코드를 받아요 📱</p>
  </div>
  <footer class="nav-row">
    <button id="btn-code-back" class="btn-big">◀ 소개 다시 보기</button>
  </footer>
</section>

<!-- ④ 도안 만들기 (프로그램 3종: 성격검사 · 이상형 월드컵 · 감정 이모티콘) -->
<section id="screen-maker" class="screen hidden">
  <header class="step-header">
    <span class="step-badge">3단계</span> <span id="maker-title">나만의 도안 만들기</span>
  </header>
  <div id="maker-body" class="maker-body"></div>
</section>

<!-- ⑤ 인쇄 중 / 등록 완료 -->

  <div class="center-box">
    <div class="spinner"></div>
    <h1>도안을 인쇄하고 있어요…</h1>
  </div>
</section>

<!-- ⑥ 대기 (미니게임 · 소개) -->

  </div>
  <div id="wait-intro" class="wait-intro hidden">
    <img id="wait-intro-img" alt="뭉클 소개">
    <div class="nav-row">
      <button id="btn-wintro-prev" class="btn-big">◀</button>
      <button id="btn-wintro-next" class="btn-big">▶</button>

  </div>
</section>

  </div>
</section>

<script>

/* ═══ 데모 모킹 — 실제 서버 없이 동작 (부스 코드와 동일 UI) ═══ */

  gameSrc: {"/content/minigame/01-monster-match/index.html": "<!DOCTYPE html>\n<html lang=\"ko\">\n<head>\n<meta charset=\"utf-8\">\n<title>몬스터 짝맞추기<\/title>\n<style>\n* { margin:0; padding:0; box-sizing:border-box; font-family:\"Pretendard\",\"Noto Sans KR\",\"Malgun Gothic\",sans-serif; user-select:none; }\nhtml,body { width:100%; height:100%; overflow:hidden; }\nbody { background:#FFF3E6; display:flex; flex-direction:column; align-items:center; }\nheader { display:flex; gap:30px; align-items:center; padding:14px; font-size:24px; font-weight:800; color:#5a4a3a; }\n#board { flex:1; display:grid; grid-template-columns:repeat(4, 130px); grid-auto-rows:130px;\n  gap:14px; align-content:center; }\n.card { border:none; border-radius:16px; font-size:64px; cursor:pointer;\n  background:#F5573B; box-shadow:0 5px 0 #b33a24; color:transparent; transition:transform .15s; }\n.card.open { background:#fff; color:inherit; box-shadow:0 5px 0 #ddd; }\n.card.done { background:#c9f2cf; color:inherit; box-shadow:none; transform:scale(.94); cursor:default; }\n#overlay { position:fixed; inset:0; background:rgba(0,0,0,.55); display:none;\n  align-items:center; justify-content:center; flex-direction:column; gap:18px; color:#fff; }\n#overlay.show { display:flex; }\n#overlay h1 { font-size:54px; }\n#overlay button { font-size:30px; font-weight:800; padding:18px 44px; border:none;\n  border-radius:16px; background:#F5573B; color:#fff; cursor:pointer; }\n<\/style>\n<\/head>\n<body>\n<header><span>🧩 몬스터 짝맞추기<\/span><span id=\"moves\">뒤집기 0회<\/span><span id=\"found\">0 / 6쌍<\/span><\/header>\n<div id=\"board\"><\/div>\n<div id=\"overlay\"><h1 id=\"ov-title\">🎉 성공!<\/h1><p id=\"ov-sub\" style=\"font-size:26px\"><\/p><button onclick=\"start()\">다시 하기<\/button><\/div>\n<script>\n\"use strict\";\nconst MONSTERS = [\"🐰\",\"🌕\",\"🍡\",\"🥮\",\"🍚\",\"🧺\"]; // 떡집 테마\nconst board = document.getElementById(\"board\");\nlet first = null, lock = false, moves = 0, found = 0;\n\nfunction start(){\n  document.getElementById(\"overlay\").classList.remove(\"show\");\n  moves = 0; found = 0; first = null; lock = false;\n  update();\n  const deck = [...MONSTERS, ...MONSTERS].sort(() => Math.random() - .5);\n  board.innerHTML = \"\";\n  deck.forEach(m => {\n    const b = document.createElement(\"button\");\n    b.className = \"card\"; b.textContent = m;\n    b.addEventListener(\"click\", () => flip(b));\n    board.appendChild(b);\n  });\n}\nfunction update(){\n  document.getElementById(\"moves\").textContent = `뒤집기 ${moves}회`;\n  document.getElementById(\"found\").textContent = `${found} / ${MONSTERS.length}쌍`;\n}\nfunction flip(b){\n  if (lock || b.classList.contains(\"open\") || b.classList.contains(\"done\")) return;\n  b.classList.add(\"open\");\n  if (!first){ first = b; return; }\n  moves++; update();\n  if (first.textContent === b.textContent){\n    first.classList.add(\"done\"); b.classList.add(\"done\");\n    first = null; found++; update();\n    if (found === MONSTERS.length){\n      document.getElementById(\"ov-sub\").textContent = `뒤집기 ${moves}회 만에 모두 찾았어요!`;\n      setTimeout(() => document.getElementById(\"overlay\").classList.add(\"show\"), 400);\n    }\n  } else {\n    lock = true;\n    const a = first; first = null;\n    setTimeout(() => { a.classList.remove(\"open\"); b.classList.remove(\"open\"); lock = false; }, 700);\n  }\n}\nstart();\n<\/script>\n<\/body>\n<\/html>\n", "/content/minigame/02-monster-catch/index.html": "<!DOCTYPE html>\n<html lang=\"ko\">\n<head>\n<meta charset=\"utf-8\">\n<title>몬스터 잡기<\/title>\n<style>\n* { margin:0; padding:0; box-sizing:border-box; font-family:\"Pretendard\",\"Noto Sans KR\",\"Malgun Gothic\",sans-serif; user-select:none; }\nhtml,body { width:100%; height:100%; overflow:hidden; }\nbody { background:#E8F6EF; display:flex; flex-direction:column; align-items:center; }\nheader { display:flex; gap:36px; padding:14px; font-size:26px; font-weight:800; color:#2f5d47; }\n#grid { flex:1; display:grid; grid-template-columns:repeat(3, 160px); grid-auto-rows:160px;\n  gap:22px; align-content:center; }\n.hole { border:none; border-radius:50%; background:#bfe3d0; box-shadow:inset 0 8px 14px rgba(0,0,0,.18);\n  font-size:84px; cursor:pointer; color:transparent; transition:background .1s; }\n.hole.up { color:inherit; background:#fff; }\n.hole.bonk { background:#ffd9d0; }\n#overlay { position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex;\n  align-items:center; justify-content:center; flex-direction:column; gap:18px; color:#fff; }\n#overlay.hide { display:none; }\n#overlay h1 { font-size:54px; }\n#overlay button { font-size:30px; font-weight:800; padding:18px 44px; border:none;\n  border-radius:16px; background:#F5573B; color:#fff; cursor:pointer; }\n<\/style>\n<\/head>\n<body>\n<header><span>🔨 몬스터 잡기<\/span><span id=\"time\">30초<\/span><span id=\"score\">0점<\/span><\/header>\n<div id=\"grid\"><\/div>\n<div id=\"overlay\"><h1 id=\"ov-title\">몬스터 잡기<\/h1><p id=\"ov-sub\" style=\"font-size:26px\">튀어나오는 몬스터를 클릭하세요!<\/p><button onclick=\"start()\">시작!<\/button><\/div>\n<script>\n\"use strict\";\nconst EMOJIS = [\"🐰\",\"🌕\",\"🍡\",\"🥮\",\"🍚\",\"🧺\"]; // 떡집 테마\nconst grid = document.getElementById(\"grid\");\nconst holes = [];\nfor (let i = 0; i < 9; i++){\n  const b = document.createElement(\"button\");\n  b.className = \"hole\"; b.textContent = \"🐙\";\n  b.addEventListener(\"click\", () => bonk(b));\n  grid.appendChild(b); holes.push(b);\n}\nlet score = 0, time = 30, popTimer = null, tickTimer = null, playing = false;\n\nfunction start(){\n  document.getElementById(\"overlay\").classList.add(\"hide\");\n  score = 0; time = 30; playing = true;\n  update();\n  tickTimer = setInterval(() => {\n    time--; update();\n    if (time <= 0) end();\n  }, 1000);\n  pop();\n}\nfunction update(){\n  document.getElementById(\"time\").textContent = `${time}초`;\n  document.getElementById(\"score\").textContent = `${score}점`;\n}\nfunction pop(){\n  if (!playing) return;\n  holes.forEach(h => h.classList.remove(\"up\"));\n  const n = Math.random() < .25 ? 2 : 1; // 가끔 2마리\n  for (let i = 0; i < n; i++){\n    const h = holes[Math.floor(Math.random() * holes.length)];\n    h.textContent = EMOJIS[Math.floor(Math.random() * EMOJIS.length)];\n    h.classList.add(\"up\");\n  }\n  const delay = Math.max(500, 950 - score * 12); // 점수 오르면 점점 빨라짐\n  popTimer = setTimeout(pop, delay);\n}\nfunction bonk(h){\n  if (!playing || !h.classList.contains(\"up\")) return;\n  score++; update();\n  h.classList.remove(\"up\"); h.classList.add(\"bonk\");\n  setTimeout(() => h.classList.remove(\"bonk\"), 150);\n}\nfunction end(){\n  playing = false;\n  clearInterval(tickTimer); clearTimeout(popTimer);\n  holes.forEach(h => h.classList.remove(\"up\"));\n  document.getElementById(\"ov-title\").textContent = \"⏰ 끝!\";\n  document.getElementById(\"ov-sub\").textContent = `${score}마리를 잡았어요!`;\n  document.querySelector(\"#overlay button\").textContent = \"다시 하기\";\n  document.getElementById(\"overlay\").classList.remove(\"hide\");\n}\n<\/script>\n<\/body>\n<\/html>\n", "/content/minigame/03-ox-quiz/index.html": "<!DOCTYPE html>\n<html lang=\"ko\">\n<head>\n<meta charset=\"utf-8\">\n<title>뭉클 O/X 퀴즈<\/title>\n<style>\n* { margin:0; padding:0; box-sizing:border-box; font-family:\"Pretendard\",\"Noto Sans KR\",\"Malgun Gothic\",sans-serif; user-select:none; }\nhtml,body { width:100%; height:100%; overflow:hidden; }\nbody { background:#FFF9E8; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:26px; padding:20px; }\n#progress { font-size:22px; font-weight:700; color:#8a7a5a; }\n#question { font-size:38px; font-weight:800; text-align:center; line-height:1.4; min-height:2.8em; max-width:900px; }\n#buttons { display:flex; gap:40px; }\n#buttons button { width:220px; height:220px; border:none; border-radius:30px; font-size:110px;\n  font-weight:900; cursor:pointer; color:#fff; box-shadow:0 8px 0 rgba(0,0,0,.2); }\n#btn-o { background:#2e9e44; } #btn-x { background:#F5573B; }\n#buttons button:active { transform:translateY(5px); box-shadow:0 3px 0 rgba(0,0,0,.2); }\n#feedback { font-size:30px; font-weight:800; min-height:1.4em; text-align:center; }\n#feedback .exp { display:block; font-size:22px; font-weight:500; color:#6a5a4a; margin-top:6px; }\n#overlay { position:fixed; inset:0; background:rgba(0,0,0,.55); display:none;\n  align-items:center; justify-content:center; flex-direction:column; gap:18px; color:#fff; }\n#overlay.show { display:flex; }\n#overlay h1 { font-size:54px; }\n#overlay button { font-size:30px; font-weight:800; padding:18px 44px; border:none;\n  border-radius:16px; background:#F5573B; color:#fff; cursor:pointer; }\n<\/style>\n<\/head>\n<body>\n<div id=\"progress\"><\/div>\n<div id=\"question\"><\/div>\n<div id=\"buttons\">\n  <button id=\"btn-o\">O<\/button>\n  <button id=\"btn-x\">X<\/button>\n<\/div>\n<div id=\"feedback\"><\/div>\n<div id=\"overlay\"><h1 id=\"ov-title\"><\/h1><p id=\"ov-sub\" style=\"font-size:28px\"><\/p><button onclick=\"start()\">다시 하기<\/button><\/div>\n<script>\n\"use strict\";\n/* ── 문항은 여기만 고치면 됩니다 (콘텐츠 교체 지점) ── */\nconst QUESTIONS = [\n  { q: \"뭉클 떡집에서는 나만의 클리커를 만들 수 있다.\", a: true,  exp: \"퀴즈 풀고 도안 만들어 직접 꾸며요!\" },\n  { q: \"부스에 숨은 떡 몬스터는 모두 4마리다.\",         a: true,  exp: \"부스 곳곳에 숨어 있어요. 다 만나 보세요!\" },\n  { q: \"떡 몬스터 퀴즈는 컴퓨터로만 풀 수 있다.\",       a: false, exp: \"내 스마트폰으로 몬스터에 콕! 접촉하면 돼요.\" },\n  { q: \"만들기존에 가려면 화면의 '띵동' 호출을 기다리면 된다.\", a: true, exp: \"자리에서 기다리면 화면이 알려줘요.\" },\n  { q: \"완성한 클리커는 김토티 심사를 받을 수 있다.\",   a: true,  exp: \"이벤트존에서 심사받고 경품 룰렛까지!\" },\n];\nlet idx = 0, score = 0, waiting = false;\nconst $ = id => document.getElementById(id);\n\nfunction start(){\n  $(\"overlay\").classList.remove(\"show\");\n  idx = 0; score = 0; waiting = false;\n  render();\n}\nfunction render(){\n  $(\"progress\").textContent = `${idx + 1} / ${QUESTIONS.length}`;\n  $(\"question\").textContent = QUESTIONS[idx].q;\n  $(\"feedback\").textContent = \"\";\n}\nfunction answer(v){\n  if (waiting) return;\n  waiting = true;\n  const cur = QUESTIONS[idx];\n  const right = v === cur.a;\n  if (right) score++;\n  $(\"feedback\").innerHTML = (right ? \"⭕ 정답!\" : \"❌ 아쉬워요!\") +\n    `<span class=\"exp\">${cur.exp}<\/span>`;\n  setTimeout(() => {\n    waiting = false;\n    idx++;\n    if (idx >= QUESTIONS.length){\n      $(\"ov-title\").textContent = score === QUESTIONS.length ? \"🏆 만점!\" : \"🎉 참 잘했어요!\";\n      $(\"ov-sub\").textContent = `${QUESTIONS.length}문제 중 ${score}문제 정답`;\n      $(\"overlay\").classList.add(\"show\");\n    } else render();\n  }, 1800);\n}\n$(\"btn-o\").addEventListener(\"click\", () => answer(true));\n$(\"btn-x\").addEventListener(\"click\", () => answer(false));\nstart();\n<\/script>\n<\/body>\n<\/html>\n", "/content/minigame/04-balloon-pop/index.html": "<!DOCTYPE html>\n<html lang=\"ko\">\n<head>\n<meta charset=\"utf-8\">\n<title>풍선 팡팡<\/title>\n<style>\n* { margin:0; padding:0; box-sizing:border-box; font-family:\"Pretendard\",\"Noto Sans KR\",\"Malgun Gothic\",sans-serif; user-select:none; }\nhtml,body { width:100%; height:100%; overflow:hidden; }\nbody { background:linear-gradient(#cfe9ff, #eef7ff); }\nheader { position:fixed; top:0; left:0; right:0; display:flex; gap:36px; justify-content:center;\n  padding:12px; font-size:26px; font-weight:800; color:#2a5a8a; z-index:5; }\n.balloon { position:absolute; border:none; background:transparent; cursor:pointer;\n  font-size:72px; line-height:1; filter:drop-shadow(0 4px 4px rgba(0,0,0,.15)); }\n.balloon.pop { animation:pop .18s forwards; }\n@keyframes pop { to { transform:scale(2); opacity:0; } }\n#overlay { position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex; z-index:10;\n  align-items:center; justify-content:center; flex-direction:column; gap:18px; color:#fff; }\n#overlay.hide { display:none; }\n#overlay h1 { font-size:54px; }\n#overlay button { font-size:30px; font-weight:800; padding:18px 44px; border:none;\n  border-radius:16px; background:#F5573B; color:#fff; cursor:pointer; }\n<\/style>\n<\/head>\n<body>\n<header><span>🎈 풍선 팡팡<\/span><span id=\"time\">40초<\/span><span id=\"score\">0점<\/span><\/header>\n<div id=\"overlay\"><h1 id=\"ov-title\">풍선 팡팡<\/h1><p id=\"ov-sub\" style=\"font-size:26px\">떠오르는 풍선을 날아가기 전에 클릭!<\/p><button onclick=\"start()\">시작!<\/button><\/div>\n<script>\n\"use strict\";\nconst COLORS = [\"🎈\",\"🟠\",\"🟣\",\"🔵\",\"🟢\"].map((_, i) => i); // 색은 filter로\nconst $ = id => document.getElementById(id);\nlet score = 0, time = 40, playing = false, spawnTimer = null, tickTimer = null, raf = null;\nconst balloons = new Set();\n\nfunction start(){\n  $(\"overlay\").classList.add(\"hide\");\n  document.querySelectorAll(\".balloon\").forEach(b => b.remove());\n  balloons.clear();\n  score = 0; time = 40; playing = true;\n  update();\n  tickTimer = setInterval(() => { time--; update(); if (time <= 0) end(); }, 1000);\n  spawn();\n  loop();\n}\nfunction update(){\n  $(\"time\").textContent = `${time}초`;\n  $(\"score\").textContent = `${score}점`;\n}\nfunction spawn(){\n  if (!playing) return;\n  const b = document.createElement(\"button\");\n  b.className = \"balloon\";\n  b.textContent = \"🎈\";\n  b.style.filter = `hue-rotate(${Math.floor(Math.random()*300)}deg) drop-shadow(0 4px 4px rgba(0,0,0,.15))`;\n  b.dataset.y = String(window.innerHeight + 40);\n  b.dataset.v = String(1.2 + Math.random() * 1.8); // 상승 속도\n  b.style.left = Math.floor(30 + Math.random() * (window.innerWidth - 130)) + \"px\";\n  b.addEventListener(\"click\", () => {\n    if (!playing || b.classList.contains(\"pop\")) return;\n    score++; update();\n    b.classList.add(\"pop\");\n    setTimeout(() => { b.remove(); balloons.delete(b); }, 180);\n  });\n  document.body.appendChild(b);\n  balloons.add(b);\n  spawnTimer = setTimeout(spawn, Math.max(350, 800 - score * 10));\n}\nfunction loop(){\n  if (!playing) return;\n  for (const b of balloons){\n    if (b.classList.contains(\"pop\")) continue;\n    let y = parseFloat(b.dataset.y) - parseFloat(b.dataset.v);\n    b.dataset.y = String(y);\n    b.style.top = y + \"px\";\n    if (y < -90){ b.remove(); balloons.delete(b); } // 놓친 풍선\n  }\n  raf = requestAnimationFrame(loop);\n}\nfunction end(){\n  playing = false;\n  clearInterval(tickTimer); clearTimeout(spawnTimer); cancelAnimationFrame(raf);\n  $(\"ov-title\").textContent = \"⏰ 끝!\";\n  $(\"ov-sub\").textContent = `풍선 ${score}개를 터뜨렸어요!`;\n  document.querySelector(\"#overlay button\").textContent = \"다시 하기\";\n  $(\"overlay\").classList.remove(\"hide\");\n}\n<\/script>\n<\/body>\n<\/html>\n", "/content/minigame/05-odd-one-out/index.html": "<!DOCTYPE html>\n<html lang=\"ko\">\n<head>\n<meta charset=\"utf-8\">\n<title>다른 몬스터 찾기<\/title>\n<style>\n* { margin:0; padding:0; box-sizing:border-box; font-family:\"Pretendard\",\"Noto Sans KR\",\"Malgun Gothic\",sans-serif; user-select:none; }\nhtml,body { width:100%; height:100%; overflow:hidden; }\nbody { background:#F3ECFF; display:flex; flex-direction:column; align-items:center; }\nheader { display:flex; gap:36px; padding:14px; font-size:26px; font-weight:800; color:#5a3a8a; }\n#grid { flex:1; display:grid; gap:10px; align-content:center; }\n#grid button { border:none; border-radius:14px; background:#fff; cursor:pointer;\n  box-shadow:0 3px 0 rgba(0,0,0,.1); display:flex; align-items:center; justify-content:center; }\n#grid button.wrong { background:#ffd9d0; }\n#overlay { position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex;\n  align-items:center; justify-content:center; flex-direction:column; gap:18px; color:#fff; }\n#overlay.hide { display:none; }\n#overlay h1 { font-size:54px; }\n#overlay button { font-size:30px; font-weight:800; padding:18px 44px; border:none;\n  border-radius:16px; background:#F5573B; color:#fff; cursor:pointer; }\n<\/style>\n<\/head>\n<body>\n<header><span>🔍 다른 몬스터 찾기<\/span><span id=\"time\">45초<\/span><span id=\"level\">1단계<\/span><\/header>\n<div id=\"grid\"><\/div>\n<div id=\"overlay\"><h1 id=\"ov-title\">다른 몬스터 찾기<\/h1><p id=\"ov-sub\" style=\"font-size:26px\">무리 속에 하나만 다른 몬스터가 있어요!<\/p><button onclick=\"start()\">시작!<\/button><\/div>\n<script>\n\"use strict\";\n/* 비슷한 이모지 짝 — [무리, 숨은 하나] */\nconst PAIRS = [\n  [\"🐸\",\"🐢\"], [\"🐤\",\"🐥\"], [\"🦊\",\"🦝\"], [\"🐙\",\"🦑\"], [\"🐳\",\"🐋\"],\n  [\"😀\",\"😃\"], [\"🌕\",\"🌝\"], [\"⭐\",\"🌟\"], [\"🍩\",\"🍪\"], [\"🎈\",\"🍎\"],\n];\nconst $ = id => document.getElementById(id);\nlet level = 1, time = 45, playing = false, tickTimer = null;\n\nfunction start(){\n  $(\"overlay\").classList.add(\"hide\");\n  level = 1; time = 45; playing = true;\n  update();\n  tickTimer = setInterval(() => { time--; update(); if (time <= 0) end(); }, 1000);\n  round();\n}\nfunction update(){\n  $(\"time\").textContent = `${time}초`;\n  $(\"level\").textContent = `${level}단계`;\n}\nfunction round(){\n  const n = Math.min(2 + level, 7); // 3×3 → 최대 7×7\n  const cell = Math.min(90, Math.floor(430 / n));\n  const grid = $(\"grid\");\n  grid.style.gridTemplateColumns = `repeat(${n}, ${cell}px)`;\n  grid.style.gridAutoRows = `${cell}px`;\n  grid.innerHTML = \"\";\n  const [base, odd] = PAIRS[Math.floor(Math.random() * PAIRS.length)];\n  const oddIdx = Math.floor(Math.random() * n * n);\n  for (let i = 0; i < n * n; i++){\n    const b = document.createElement(\"button\");\n    b.textContent = i === oddIdx ? odd : base;\n    b.style.fontSize = Math.floor(cell * .62) + \"px\";\n    b.addEventListener(\"click\", () => {\n      if (!playing) return;\n      if (i === oddIdx){ level++; time = Math.min(time + 3, 60); update(); round(); } // 보너스 3초\n      else { b.classList.add(\"wrong\"); time = Math.max(time - 2, 1); update();\n             setTimeout(() => b.classList.remove(\"wrong\"), 300); }\n    });\n    grid.appendChild(b);\n  }\n}\nfunction end(){\n  playing = false;\n  clearInterval(tickTimer);\n  $(\"grid\").innerHTML = \"\";\n  $(\"ov-title\").textContent = \"⏰ 끝!\";\n  $(\"ov-sub\").textContent = `${level - 1}단계까지 통과했어요!`;\n  document.querySelector(\"#overlay button\").textContent = \"다시 하기\";\n  $(\"overlay\").classList.remove(\"hide\");\n}\n<\/script>\n<\/body>\n<\/html>\n", "/content/minigame/06-tteok-memory/index.html": "<!DOCTYPE html>\n<html lang=\"ko\">\n<head>\n<meta charset=\"utf-8\">\n<title>떡 주문 기억왕<\/title>\n<style>\n/* 순차 기억 → 4지선다 회상 + 답안 슬롯 (토러스 메모리 게임의 UX를 떡집 테마로) */\n* { margin:0; padding:0; box-sizing:border-box; font-family:\"Pretendard\",\"Noto Sans KR\",\"Malgun Gothic\",sans-serif; user-select:none; }\nhtml,body { width:100%; height:100%; overflow:hidden; }\nbody { background:#ACD6E8; display:flex; flex-direction:column; align-items:center; }\nheader { display:flex; gap:30px; padding:12px; font-size:24px; font-weight:800; color:#7E212F; }\n#stage { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px; width:100%; }\n#speech { font-size:26px; font-weight:700; color:#3d2723; min-height:1.5em; }\n#show-item { font-size:110px; min-height:130px; display:flex; flex-direction:column; align-items:center; }\n#show-item small { font-size:24px; font-weight:800; color:#7E212F; }\n#slots { display:flex; gap:14px; }\n.slot { width:74px; height:74px; background:#FFF9EF; border:4px dashed #d9c5a8; border-radius:14px;\n  font-size:44px; display:flex; align-items:center; justify-content:center; }\n.slot.filled { border-style:solid; border-color:#F2C744; }\n.slot.wrong { border-color:#c0392b; background:#ffe0da; animation:shake .4s; }\n@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-9px)} 75%{transform:translateX(9px)} }\n#choices { display:flex; gap:20px; }\n#choices button { width:130px; height:130px; border:none; border-radius:20px; background:#FFF9EF;\n  font-size:64px; cursor:pointer; box-shadow:0 5px 0 rgba(0,0,0,.15);\n  display:flex; flex-direction:column; align-items:center; justify-content:center; }\n#choices button small { font-size:18px; font-weight:800; color:#7E212F; }\n#choices button:active { transform:translateY(3px); }\n#overlay { position:fixed; inset:0; background:rgba(43,30,25,.6); display:flex;\n  align-items:center; justify-content:center; flex-direction:column; gap:18px; color:#fff; }\n#overlay.hide { display:none; }\n#overlay h1 { font-size:52px; }\n#overlay button { font-size:30px; font-weight:800; padding:18px 44px; border:none;\n  border-radius:16px; background:#7E212F; color:#F2C744; cursor:pointer; }\n<\/style>\n<\/head>\n<body>\n<header><span>🧠 떡 주문 기억왕<\/span><span id=\"lives\">❤️❤️❤️<\/span><span id=\"round\">1번째 주문<\/span><\/header>\n<div id=\"stage\">\n  <div id=\"speech\"><\/div>\n  <div id=\"show-item\"><\/div>\n  <div id=\"slots\"><\/div>\n  <div id=\"choices\"><\/div>\n<\/div>\n<div id=\"overlay\"><h1 id=\"ov-title\">떡 주문 기억왕<\/h1><p id=\"ov-sub\" style=\"font-size:26px\">달토끼 사장님의 떡 주문을 순서대로 외워 담아요!<\/p><button onclick=\"start()\">시작!<\/button><\/div>\n<script>\n\"use strict\";\nconst TTEOK = [\n  { e:\"🍡\", n:\"꼬치떡\" }, { e:\"🥮\", n:\"달떡\" }, { e:\"🍚\", n:\"백설기\" }, { e:\"🌕\", n:\"보름떡\" },\n];\nconst $ = id => document.getElementById(id);\nlet seq = [], input = 0, lives = 3, round = 1, phase = \"idle\";\n\nfunction start(){\n  $(\"overlay\").classList.add(\"hide\");\n  lives = 3; round = 1;\n  update();\n  newOrder();\n}\nfunction update(){\n  $(\"lives\").textContent = \"❤️\".repeat(lives) + \"🤍\".repeat(3 - lives);\n  $(\"round\").textContent = `${round}번째 주문`;\n}\nfunction seqLen(){ return Math.min(1 + round, 6); } // 2개부터 시작, 최대 6개\n\nfunction newOrder(){\n  seq = Array.from({length: seqLen()}, () => Math.floor(Math.random() * TTEOK.length));\n  input = 0;\n  showOrder();\n}\nasync function showOrder(){\n  phase = \"show\";\n  $(\"choices\").innerHTML = \"\";\n  $(\"slots\").innerHTML = \"\";\n  $(\"speech\").textContent = \"🐰 사장님: 주문 나갑니다~ 잘 보세요!\";\n  for (const i of seq){\n    $(\"show-item\").innerHTML = `${TTEOK[i].e}<small>${TTEOK[i].n}<\/small>`;\n    await sleep(850);\n    $(\"show-item\").innerHTML = \"\";\n    await sleep(180);\n  }\n  recall();\n}\nfunction recall(){\n  phase = \"recall\";\n  $(\"speech\").textContent = \"순서대로 담아 주세요!\";\n  const slots = $(\"slots\");\n  slots.innerHTML = \"\";\n  seq.forEach(() => slots.appendChild(el(\"div\", \"slot\")));\n  const ch = $(\"choices\");\n  ch.innerHTML = \"\";\n  TTEOK.forEach((t, i) => {\n    const b = document.createElement(\"button\");\n    b.innerHTML = `${t.e}<small>${t.n}<\/small>`;\n    b.addEventListener(\"click\", () => pick(i));\n    ch.appendChild(b);\n  });\n}\nfunction pick(i){\n  if (phase !== \"recall\") return;\n  const slot = document.querySelectorAll(\".slot\")[input];\n  slot.textContent = TTEOK[i].e; // 내가 누른 것을 그대로 보여준다 (오해 방지)\n  if (i === seq[input]){\n    slot.classList.add(\"filled\");\n    input++;\n    if (input === seq.length){\n      phase = \"idle\";\n      $(\"speech\").textContent = \"🎉 주문 완벽! 다음 주문 들어갑니다\";\n      round++;\n      update();\n      setTimeout(newOrder, 1100);\n    }\n  } else {\n    phase = \"idle\";\n    slot.classList.add(\"wrong\");\n    lives--;\n    update();\n    if (lives <= 0){\n      $(\"ov-title\").textContent = \"😵 주문이 밀렸어요!\";\n      $(\"ov-sub\").textContent = `${round - 1}개 주문까지 성공!`;\n      document.querySelector(\"#overlay button\").textContent = \"다시 하기\";\n      setTimeout(() => $(\"overlay\").classList.remove(\"hide\"), 700);\n    } else {\n      $(\"speech\").textContent = \"앗, 다른 떡이에요! 새 주문으로 다시~\";\n      setTimeout(newOrder, 1200); // 같은 길이 · 새 시퀀스\n    }\n  }\n}\nfunction el(tag, cls){ const e = document.createElement(tag); e.className = cls; return e; }\nconst sleep = ms => new Promise(r => setTimeout(r, ms));\n<\/script>\n<\/body>\n<\/html>\n", "/content/minigame/07-tteok-balance/index.html": "<!DOCTYPE html>\n<html lang=\"ko\">\n<head>\n<meta charset=\"utf-8\">\n<title>기우뚱 떡시루<\/title>\n<style>\n/* 균형 저울 게임의 '실시간 기울기 피드백'만 가져온 감각 버전 —\n * 숫자·등식 없음. 떡 크기를 눈으로 가늠해 수평을 맞춘다. 클릭만으로 조작. */\n* { margin:0; padding:0; box-sizing:border-box; font-family:\"Pretendard\",\"Noto Sans KR\",\"Malgun Gothic\",sans-serif; user-select:none; }\nhtml,body { width:100%; height:100%; overflow:hidden; }\nbody { background:#FFF9EF; display:flex; flex-direction:column; align-items:center; }\nheader { display:flex; gap:30px; padding:12px; font-size:24px; font-weight:800; color:#7E212F; }\n#hint { font-size:22px; font-weight:700; color:#8a6d4f; min-height:1.4em; }\n#scale-area { position:relative; width:820px; height:300px; margin-top:8px; }\n#beam { position:absolute; left:50%; top:70px; width:640px; height:14px; margin-left:-320px;\n  background:#7E212F; border-radius:7px; transition:transform .5s; transform-origin:center; }\n#pillar { position:absolute; left:50%; top:78px; width:18px; height:150px; margin-left:-9px;\n  background:#7E212F; border-radius:6px; }\n#base { position:absolute; left:50%; top:224px; width:200px; height:18px; margin-left:-100px;\n  background:#7E212F; border-radius:9px; }\n.pan { position:absolute; top:6px; width:230px; min-height:96px; border-radius:0 0 60px 60px;\n  background:#F2C744; box-shadow:inset 0 -8px 0 rgba(0,0,0,.15);\n  display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:center; gap:2px; padding:8px 6px 14px;\n  transition:transform .5s; }\n#pan-left  { left:-16px; }\n#pan-right { right:-16px; }\n.pan .t { line-height:1; }\n#pan-right .t { cursor:pointer; }\n#pan-right .t:hover { filter:brightness(1.15); }\n#tray { display:flex; gap:16px; align-items:flex-end; justify-content:center;\n  background:#EADFCE; border-radius:20px; padding:14px 26px; min-height:110px; margin-top:14px; }\n#tray button { border:none; background:transparent; cursor:pointer; line-height:1; }\n#tray button:active { transform:scale(.9); }\n#tray-label { font-size:18px; font-weight:800; color:#8a6d4f; margin-top:6px; }\n#overlay { position:fixed; inset:0; background:rgba(43,30,25,.6); display:flex; z-index:5;\n  align-items:center; justify-content:center; flex-direction:column; gap:18px; color:#fff; }\n#overlay.hide { display:none; }\n#overlay h1 { font-size:52px; }\n#overlay button { font-size:30px; font-weight:800; padding:18px 44px; border:none;\n  border-radius:16px; background:#7E212F; color:#F2C744; cursor:pointer; }\n.level-flash { animation:levelglow 1s; }\n@keyframes levelglow { 0%,100%{filter:none} 50%{filter:drop-shadow(0 0 24px #F2C744)} }\n<\/style>\n<\/head>\n<body>\n<header><span>⚖️ 기우뚱 떡시루<\/span><span id=\"time\">90초<\/span><span id=\"round\">1 / 5판<\/span><\/header>\n<div id=\"hint\">왼쪽 시루와 수평이 되게, 아래 떡을 골라 오른쪽 시루에 올려요! (올린 떡을 누르면 다시 내려요)<\/div>\n<div id=\"scale-area\">\n  <div id=\"pillar\"><\/div><div id=\"base\"><\/div>\n  <div id=\"beam\">\n    <div class=\"pan\" id=\"pan-left\"><\/div>\n    <div class=\"pan\" id=\"pan-right\"><\/div>\n  <\/div>\n<\/div>\n<div id=\"tray\"><\/div>\n<div id=\"tray-label\">떡 보관함 — 클릭해서 올리기<\/div>\n<div id=\"overlay\"><h1 id=\"ov-title\">기우뚱 떡시루<\/h1><p id=\"ov-sub\" style=\"font-size:26px\">숫자 없이 눈대중으로! 저울을 수평으로 만들어요<\/p><button onclick=\"start()\">시작!<\/button><\/div>\n<script>\n\"use strict\";\nconst EMOJIS = [\"🍡\",\"🥮\",\"🍚\",\"🌕\",\"🧁\",\"🥯\"];\nconst $ = id => document.getElementById(id);\nlet leftItems = [], tray = [], right = [], round = 1, time = 90, tick = null, playing = false, uid = 0;\n\nfunction start(){\n  $(\"overlay\").classList.add(\"hide\");\n  round = 1; time = 90; playing = true;\n  clearInterval(tick);\n  tick = setInterval(() => { time--; hud(); if (time <= 0) end(false); }, 1000);\n  newRound();\n}\nfunction hud(){\n  $(\"time\").textContent = `${time}초`;\n  $(\"round\").textContent = `${round} / 5판`;\n}\nfunction item(w){\n  return { id: uid++, w, e: EMOJIS[Math.floor(Math.random() * EMOJIS.length)] };\n}\nfunction newRound(){\n  hud();\n  // 왼쪽: 2~3개 (합 L) / 보관함: 정답 부분집합(합 L, 2~3개) + 미끼 3개\n  const nl = 2 + (round > 2 ? 1 : 0);\n  leftItems = Array.from({length: nl}, () => item(2 + Math.floor(Math.random() * (3 + round))));\n  const L = leftItems.reduce((s, t) => s + t.w, 0);\n  const ns = 2 + Math.floor(Math.random() * 2);\n  const sol = [];\n  let rest = L;\n  for (let i = 0; i < ns - 1; i++){\n    const w = Math.max(1, Math.min(rest - (ns - 1 - i), 1 + Math.floor(Math.random() * (rest - 1))));\n    sol.push(item(w)); rest -= w;\n  }\n  sol.push(item(rest));\n  const decoys = Array.from({length: 3}, () => item(1 + Math.floor(Math.random() * 8)));\n  tray = [...sol, ...decoys].sort(() => Math.random() - .5);\n  right = [];\n  render();\n}\nfunction fontFor(w){ return (26 + w * 7) + \"px\"; }\nfunction render(){\n  const pl = $(\"pan-left\"), pr = $(\"pan-right\"), tr = $(\"tray\");\n  pl.innerHTML = \"\"; pr.innerHTML = \"\"; tr.innerHTML = \"\";\n  for (const t of leftItems){\n    const s = document.createElement(\"span\");\n    s.className = \"t\"; s.textContent = t.e; s.style.fontSize = fontFor(t.w);\n    pl.appendChild(s);\n  }\n  for (const t of right){\n    const s = document.createElement(\"span\");\n    s.className = \"t\"; s.textContent = t.e; s.style.fontSize = fontFor(t.w);\n    s.title = \"내리기\";\n    s.addEventListener(\"click\", () => { if (!playing) return; right = right.filter(x => x.id !== t.id); tray.push(t); render(); });\n    pr.appendChild(s);\n  }\n  for (const t of tray){\n    const b = document.createElement(\"button\");\n    b.textContent = t.e; b.style.fontSize = fontFor(t.w);\n    b.addEventListener(\"click\", () => { if (!playing) return; tray = tray.filter(x => x.id !== t.id); right.push(t); render(); });\n    tr.appendChild(b);\n  }\n  tilt();\n}\nfunction tilt(){\n  const L = leftItems.reduce((s, t) => s + t.w, 0);\n  const R = right.reduce((s, t) => s + t.w, 0);\n  const ang = Math.max(-14, Math.min(14, (L - R) * 3)); // 왼쪽이 무거우면 왼쪽으로 기움\n  $(\"beam\").style.transform = `rotate(${-ang}deg)`;\n  document.querySelectorAll(\".pan\").forEach(p => p.style.transform = `rotate(${ang}deg)`);\n  if (playing && right.length && L === R){\n    playing = false;\n    $(\"beam\").classList.add(\"level-flash\");\n    $(\"hint\").textContent = \"✨ 수평! 완벽한 떡시루!\";\n    setTimeout(() => {\n      $(\"beam\").classList.remove(\"level-flash\");\n      $(\"hint\").textContent = \"왼쪽 시루와 수평이 되게, 아래 떡을 골라 오른쪽 시루에 올려요!\";\n      round++;\n      if (round > 5) return end(true);\n      playing = true;\n      newRound();\n    }, 1300);\n  }\n}\nfunction end(cleared){\n  playing = false;\n  clearInterval(tick);\n  $(\"ov-title\").textContent = cleared ? \"🏆 떡시루 균형왕!\" : \"⏰ 끝!\";\n  $(\"ov-sub\").textContent = cleared ? `5판 모두 수평 성공! (남은 시간 ${time}초)` : `${round - 1}판까지 수평 성공!`;\n  document.querySelector(\"#overlay button\").textContent = \"다시 하기\";\n  $(\"overlay\").classList.remove(\"hide\");\n}\n<\/script>\n<\/body>\n<\/html>\n", "/content/minigame/08-moon-hop/index.html": "<!DOCTYPE html>\n<html lang=\"ko\">\n<head>\n<meta charset=\"utf-8\">\n<title>껑충 달토끼<\/title>\n<style>\n/* 기사의 여행(나이트 투어)의 이동 규칙을 달토끼 점프로 — 방문한 구름은 사라지고, 못 뛰면 종료 */\n* { margin:0; padding:0; box-sizing:border-box; font-family:\"Pretendard\",\"Noto Sans KR\",\"Malgun Gothic\",sans-serif; user-select:none; }\nhtml,body { width:100%; height:100%; overflow:hidden; }\nbody { background:#274060; display:flex; flex-direction:column; align-items:center; color:#fff; }\nheader { display:flex; gap:30px; padding:12px; font-size:24px; font-weight:800; color:#F2C744; }\n#msg { font-size:20px; font-weight:700; color:#cfe0f0; min-height:1.4em; }\n#board { flex:1; display:grid; grid-template-columns:repeat(5, 92px); grid-auto-rows:92px;\n  gap:10px; align-content:center; }\n.cell { border:none; border-radius:18px; font-size:46px; cursor:default; position:relative;\n  background:#3a5a80; display:flex; align-items:center; justify-content:center; transition:background .2s; }\n.cell.cloud { background:#EAF3FA; }\n.cell.gone { background:rgba(255,255,255,.06); }\n.cell.target { background:#F2C744; cursor:pointer; animation:bounce 1s infinite; }\n@keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-7px)} }\n.cell.rabbit { background:#FFF9EF; }\n#overlay { position:fixed; inset:0; background:rgba(15,25,40,.75); display:flex;\n  align-items:center; justify-content:center; flex-direction:column; gap:18px; }\n#overlay.hide { display:none; }\n#overlay h1 { font-size:52px; color:#F2C744; }\n#overlay button { font-size:30px; font-weight:800; padding:18px 44px; border:none;\n  border-radius:16px; background:#7E212F; color:#F2C744; cursor:pointer; }\n<\/style>\n<\/head>\n<body>\n<header><span>🐰 껑충 달토끼<\/span><span id=\"score\">떡 0개<\/span><\/header>\n<div id=\"msg\">노란 구름으로만 껑충! (두 칸 + 옆 한 칸 L자 점프)<\/div>\n<div id=\"board\"><\/div>\n<div id=\"overlay\"><h1 id=\"ov-title\">🐰 껑충 달토끼<\/h1><p id=\"ov-sub\" style=\"font-size:24px;color:#cfe0f0\">달토끼가 L자로 껑충! 지나간 구름은 사라져요.<br>구름 위 떡을 최대한 많이 모아 보세요 (최대 24개)<\/p><button onclick=\"start()\">시작!<\/button><\/div>\n<script>\n\"use strict\";\nconst N = 5;\nconst MOVES = [[1,2],[2,1],[-1,2],[-2,1],[1,-2],[2,-1],[-1,-2],[-2,-1]];\nconst $ = id => document.getElementById(id);\nconst board = $(\"board\");\nlet cells = [], visited = [], pos = 0, score = 0, playing = false;\n\nfor (let i = 0; i < N * N; i++){\n  const b = document.createElement(\"button\");\n  b.className = \"cell\";\n  b.addEventListener(\"click\", () => jump(i));\n  board.appendChild(b);\n  cells.push(b);\n}\nfunction idx(r, c){ return r * N + c; }\nfunction legalTargets(){\n  const r = Math.floor(pos / N), c = pos % N;\n  return MOVES.map(([dr, dc]) => [r + dr, c + dc])\n    .filter(([nr, nc]) => nr >= 0 && nr < N && nc >= 0 && nc < N && !visited[idx(nr, nc)])\n    .map(([nr, nc]) => idx(nr, nc));\n}\nfunction start(){\n  $(\"overlay\").classList.add(\"hide\");\n  visited = Array(N * N).fill(false);\n  score = 0;\n  pos = idx(2, 2); // 가운데 출발\n  visited[pos] = true;\n  playing = true;\n  render();\n}\nfunction render(){\n  const targets = new Set(playing ? legalTargets() : []);\n  cells.forEach((b, i) => {\n    b.className = \"cell\";\n    if (i === pos){ b.classList.add(\"rabbit\"); b.textContent = \"🐰\"; }\n    else if (visited[i]){ b.classList.add(\"gone\"); b.textContent = \"\"; }\n    else if (targets.has(i)){ b.classList.add(\"target\"); b.textContent = \"🍡\"; }\n    else { b.classList.add(\"cloud\"); b.textContent = \"🍡\"; }\n  });\n  $(\"score\").textContent = `떡 ${score}개`;\n  if (playing && targets.size === 0) end();\n}\nfunction jump(i){\n  if (!playing) return;\n  if (!legalTargets().includes(i)) return;\n  pos = i;\n  visited[i] = true;\n  score++;\n  render();\n}\nfunction end(){\n  playing = false;\n  const perfect = score === N * N - 1;\n  $(\"ov-title\").textContent = perfect ? \"🌕 전설의 달토끼!\" : \"🐰 착지 완료!\";\n  $(\"ov-sub\").innerHTML = perfect\n    ? \"구름 24개를 전부 밟았어요! 완벽한 여행!\"\n    : `떡 ${score}개 획득! 더 갈 수 있는 구름이 없어요.<br>다른 길로 가면 더 모을 수 있을까요?`;\n  document.querySelector(\"#overlay button\").textContent = \"다시 하기\";\n  setTimeout(() => $(\"overlay\").classList.remove(\"hide\"), 600);\n}\n<\/script>\n<\/body>\n<\/html>\n"},
  number: 6,

window.WebSocket = class { constructor() { this.readyState = 0; } send() {} close() {} };
const _json = (data) => Promise.resolve({ ok: true, status: 200, json: async () => data });
window.fetch = (url, opts) => {
  const u = String(url);
  if (u.includes("/api/config"))    return _json({ stations: ["A","B"], called_seconds: 8, brand_color: "#7E212F", code_length: 4 });
  if (u.includes("/api/intro"))     return _json({ intro: DEMO.intro });
  if (u.includes("/api/maker"))     return _json({ maker: DEMO.maker });

};

/* 뭉클 부스 키오스크 상태 머신
 *
 * 어트랙트 → 알아보기 → 코드 입력 → 도안 선택 → 인쇄 → 대기(미니게임/소개) → 띵동 호출 → 어트랙트
 *
 * - 스테이션 지정: ?station=A (기본 A) — 호출 이벤트는 자기 스테이션만 반응
 * - 호출 인터럽트 최우선: 어떤 화면(미니게임 포함)에서도 called 이벤트가 오면 즉시 오버레이
 * - 사운드: WebAudio 합성 띵동 (외부 파일·인터넷 불필요)
 */
"use strict";

const params = new URLSearchParams(location.search);
const STATION = (params.get("station") || "A").toUpperCase();
const IDLE_LIMIT_MS = 90 * 1000; // 어트랙트 자동 복귀 (대기 화면 제외)

let calledSeconds = 12;
let codeLen = 4; // 서버 /api/config가 quiz.json 코드 길이로 알려줌
let introImages = [];
let introIdx = 0;
let waitIntroIdx = 0;
let myNumber = null;
let code = "";
let idleTimer = null;

const $ = (id) => document.getElementById(id);
const screens = ["attract", "intro", "code", "maker", "printing", "wait", "called"];
let current = "attract";

function show(name) {
  current = name;
  for (const s of screens) $("screen-" + s).classList.toggle("hidden", s !== name);
  resetIdle();
}

/* ── 유휴 복귀: 진행 중 화면에서 조작이 없으면 어트랙트로 (대기·호출 화면은 예외) ── */
function resetIdle() {
  clearTimeout(idleTimer);
  if (current === "wait" || current === "called" || current === "attract") return;
  idleTimer = setTimeout(() => show("attract"), IDLE_LIMIT_MS);
}
document.addEventListener("click", resetIdle);

/* ── 사운드: 띵동 (WebAudio 합성) ── */
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === "suspended") audioCtx.resume();
}
function tone(freq, t0, dur, gain = 0.5) {
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = "sine"; o.frequency.value = freq;
  g.gain.setValueAtTime(gain, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g).connect(audioCtx.destination);
  o.start(t0); o.stop(t0 + dur);
}
function dingDong(times = 3) {
  ensureAudio();
  const now = audioCtx.currentTime;
  for (let i = 0; i < times; i++) {
    tone(880, now + i * 1.1, 0.9);        // 띵
    tone(659, now + i * 1.1 + 0.35, 1.0); // 동
  }
}
function clickBeep() { ensureAudio(); tone(1200, audioCtx.currentTime, 0.08, 0.15); }

/* ── ① 어트랙트 ── */
// 브로슈어는 대기존에서 읽는 흐름이므로 시작 = 바로 코드 입력 (소개는 선택)
$("btn-start").addEventListener("click", () => { ensureAudio(); startCode(); });
$("btn-attract-intro").addEventListener("click", () => { ensureAudio(); startIntro(); });

/* ── ② 뭉클 알아보기 ── */
function startIntro() {
  introIdx = 0;
  renderIntro();
  show("intro");
}
function renderIntro() {
  const img = $("intro-img"), empty = $("intro-empty");
  if (introImages.length === 0) {
    img.classList.add("hidden"); empty.classList.remove("hidden");
    $("intro-dots").textContent = "";
    return;
  }
  img.classList.remove("hidden"); empty.classList.add("hidden");
  img.src = introImages[introIdx];
  $("intro-dots").textContent = introImages.map((_, i) => (i === introIdx ? "●" : "○")).join(" ");
}
$("btn-intro-prev").addEventListener("click", () => {
  if (!introImages.length) return;
  introIdx = (introIdx - 1 + introImages.length) % introImages.length; renderIntro();
});
$("btn-intro-next").addEventListener("click", () => {
  if (!introImages.length) return;
  introIdx = (introIdx + 1) % introImages.length; renderIntro();
});
$("btn-to-code").addEventListener("click", startCode);

/* ── ③ 코드 입력 ── */
function buildCodeDisplay() {
  const disp = $("code-display");
  disp.innerHTML = "";
  for (let i = 0; i < codeLen; i++) {
    const s = document.createElement("span");
    s.className = "digit";
    disp.appendChild(s);
  }
  $("code-title").textContent = `몬스터가 알려준 ${codeLen}자리 코드를 입력하세요`;
}
function startCode() {
  code = "";
  buildCodeDisplay();
  renderCode();
  setCodeMsg("스마트폰으로 몬스터에 접촉해 퀴즈를 풀면 코드를 받아요 📱", "");
  show("code");
}
function renderCode() {
  const digits = document.querySelectorAll("#code-display .digit");
  digits.forEach((d, i) => (d.textContent = code[i] || ""));
}
function setCodeMsg(text, cls) {
  const el = $("code-msg");
  el.textContent = text;
  el.className = "code-msg" + (cls ? " " + cls : "");
}
function buildKeypad() {
  const pad = $("keypad");
  const keys = ["1","2","3","4","5","6","7","8","9","","0","del"];
  for (const k of keys) {
    if (k === "") { pad.appendChild(document.createElement("span")); continue; }
    const b = document.createElement("button");
    if (k === "del") { b.textContent = "지우기"; b.className = "key-del"; }
    else b.textContent = k;
    b.addEventListener("click", () => { clickBeep(); pressKey(k); });
    pad.appendChild(b);
  }
}
async function pressKey(k) {
  if (k === "del") { code = code.slice(0, -1); renderCode(); return; }
  if (code.length >= codeLen) return;
  code += k;
  renderCode();
  if (code.length === codeLen) await verifyCode();
}
async function verifyCode() {
  try {
    const r = await fetch("/api/code/verify", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ code, station: STATION }),
    });
    const j = await r.json();
    if (j.ok) {
      setCodeMsg("정답입니다! 🎉", "ok");
      setTimeout(() => startMaker(), 900);
    } else {
      setCodeMsg("코드가 맞지 않아요 — 다시 확인해 주세요", "bad");
      const disp = $("code-display");
      disp.classList.add("error");
      setTimeout(() => { disp.classList.remove("error"); code = ""; renderCode(); }, 700);
    }
  } catch (e) {
    setCodeMsg("서버 연결을 확인해 주세요", "bad");
    code = ""; renderCode();
  }
}
$("btn-code-back").addEventListener("click", startIntro);

/* ── ④ 도안 만들기 — 프로그램 3종 (성격검사 · 이상형 월드컵 · 감정 이모티콘) ── */
let makerConf = {};

function makerBody(...nodes) {
  const body = $("maker-body");
  body.innerHTML = "";
  for (const n of nodes) body.appendChild(n);
  return body;
}
function el(tag, cls, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  return e;
}
function bigChoice(emoji, label, sub, onclick) {
  const b = document.createElement("button");
  b.innerHTML = (emoji ? `<span class="c-emoji">${emoji}</span>` : "") +
    `<span>${label}</span>` + (sub ? `<span class="m-desc">${sub}</span>` : "");
  b.addEventListener("click", () => { clickBeep(); onclick(); });
  return b;
}

async function startMaker() {
  try {
    makerConf = (await (await fetch("/api/maker")).json()).maker || {};
  } catch (e) { makerConf = {}; }
  $("maker-title").textContent = "나만의 도안 만들기 — 방법을 고르세요";
  const menu = el("div", "maker-menu");
  const programs = [
    ["personality", () => runPersonality(makerConf.personality)],
    ["worldcup",    () => runWorldcup(makerConf.worldcup)],
    ["emotion",     () => runEmotion(makerConf.emotion)],
  ];
  let any = false;
  for (const [key, run] of programs) {
    const conf = makerConf[key];
    if (!conf) continue;
    any = true;
    const b = document.createElement("button");
    b.innerHTML = `<span class="m-emoji">${conf.emoji || "🎨"}</span>` +
      `<span>${conf.title}</span><span class="m-desc">${conf.desc || ""}</span>`;
    b.addEventListener("click", () => { clickBeep(); run(); });
    menu.appendChild(b);
  }
  if (!any) { startDosanGrid(); return; } // 설정 없으면 목록 선택으로 폴백
  makerBody(menu);
  show("maker");
}

/* 프로그램 1 — 성격검사 */
function runPersonality(conf) {
  $("maker-title").textContent = conf.title;
  const scores = {};
  let qi = 0;
  function ask() {
    const q = conf.questions[qi];
    const prog = el("div", "maker-progress", `${qi + 1} / ${conf.questions.length}`);
    const question = el("div", "maker-q", q.q);
    const choices = el("div", "maker-choices");
    for (const a of q.a) {
      choices.appendChild(bigChoice("", a.t, "", () => {
        for (const [name, pt] of Object.entries(a.s || {}))
          scores[name] = (scores[name] || 0) + pt;
        qi++;
        if (qi < conf.questions.length) ask();
        else finish();
      }));
    }
    makerBody(prog, question, choices);
  }
  function finish() {
    let best = null;
    for (const [name, pt] of Object.entries(scores))
      if (!best || pt > scores[best]) best = name;
    const r = conf.results[best] || {};
    showMakerResult(r.emoji || "🐾", best, r.line || "", r.pdf);
  }
  ask();
  show("maker");
}

/* 프로그램 2 — 음식 이상형 월드컵 */
function runWorldcup(conf) {
  $("maker-title").textContent = conf.title;
  let round = [...conf.candidates].sort(() => Math.random() - .5);
  let next = [], mi = 0;
  const roundName = n => n === 2 ? "결승" : `${n}강`;
  function match() {
    const a = round[mi], b = round[mi + 1];
    const prog = el("div", "maker-progress",
      `${roundName(round.length)} · ${mi / 2 + 1} / ${round.length / 2}`);
    const question = el("div", "maker-q", "더 좋아하는 쪽을 클릭!");
    const choices = el("div", "maker-choices");
    choices.appendChild(bigChoice(a.emoji, a.name, "", () => pick(a)));
    choices.appendChild(el("span", "vs-badge", "VS"));
    choices.appendChild(bigChoice(b.emoji, b.name, "", () => pick(b)));
    makerBody(prog, question, choices);
  }
  function pick(winner) {
    next.push(winner);
    mi += 2;
    if (mi >= round.length) {
      if (next.length === 1)
        return showMakerResult(next[0].emoji, next[0].name, "나의 최애 음식 우승!", next[0].pdf);
      round = next; next = []; mi = 0;
    }
    match();
  }
  match();
  show("maker");
}

/* 프로그램 3 — 감정 이모티콘 */
function runEmotion(conf) {
  $("maker-title").textContent = conf.title;
  const question = el("div", "maker-q", conf.prompt || "지금 내 기분은?");
  const choices = el("div", "maker-choices");
  for (const emo of conf.emotions)
    choices.appendChild(bigChoice(emo.emoji, emo.name, "", () =>
      showMakerResult(emo.emoji, emo.name, "오늘의 내 감정 이모티콘!", emo.pdf)));
  makerBody(question, choices);
  show("maker");
}

/* 결과 화면 → 인쇄 확정 */
function showMakerResult(emoji, name, line, pdf) {
  $("maker-title").textContent = "결과가 나왔어요!";
  const box = el("div", "maker-choices");
  box.appendChild(bigChoice("🖨", "이 도안으로 인쇄하기", "", () => {
    if (pdf) complete(pdf);
    else startDosanGrid(); // 결과에 도안이 연결 안 된 경우 폴백
  }));
  box.appendChild(bigChoice("↩", "다른 방법으로 만들기", "", startMaker));
  makerBody(
    el("div", "maker-result-emoji", emoji),
    el("div", "maker-result-name", name),
    el("div", "maker-result-line", line),
    box,
  );
}

/* 폴백 — 전체 도안 목록에서 직접 선택 */
async function startDosanGrid() {
  $("maker-title").textContent = "마음에 드는 도안을 고르세요";
  const grid = el("div", "dosan-grid");
  let list = [];
  try { list = (await (await fetch("/api/dosan")).json()).dosan; } catch (e) {}
  if (!list.length) {
    makerBody(el("p", "", '<span style="font-size:30px;color:#999">도안 준비 중이에요 — 스태프를 불러 주세요</span>'));
    show("maker");
    return;
  }
  if (list.length === 1) { complete(list[0].file); return; }
  for (const d of list) {
    const b = document.createElement("button");
    b.textContent = "🎨 " + d.label;
    b.addEventListener("click", () => { clickBeep(); complete(d.file); });
    grid.appendChild(b);
  }
  makerBody(grid);
  show("maker");
}

/* ── ⑤ 완료 → 인쇄 → 대기 등록 ── */
async function complete(dosanFile) {
  show("printing");
  try {
    const r = await fetch("/api/complete", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ station: STATION, dosan: dosanFile }),
    });
    if (!r.ok) {
      const j = await r.json().catch(() => ({}));
      alert(j.detail || "등록에 실패했어요 — 스태프를 불러 주세요");
      show("attract");
      return;
    }
    const j = await r.json();
    myNumber = j.number;
    startWait();
  } catch (e) {
    alert("서버 연결을 확인해 주세요");
    show("attract");
  }
}

/* ── ⑥ 대기 (미니게임 · 소개) ── */
async function startWait() {
  $("wait-number").textContent = `No. ${String(myNumber).padStart(3, "0")}`;
  selectTab("game");
  exitGame();
  await loadGameMenu();
  waitIntroIdx = 0;
  renderWaitIntro();
  show("wait");
}
function selectTab(which) {
  $("tab-game").classList.toggle("active", which === "game");
  $("tab-intro").classList.toggle("active", which === "intro");
  const inGame = !$("wait-game-frame-wrap").classList.contains("hidden");
  $("wait-game-menu").classList.toggle("hidden", which !== "game" || inGame);
  $("wait-game-frame-wrap").classList.toggle("hidden", which !== "game" || !inGame);
  $("wait-intro").classList.toggle("hidden", which !== "intro");
}
$("tab-game").addEventListener("click", () => selectTab("game"));
$("tab-intro").addEventListener("click", () => selectTab("intro"));

async function loadGameMenu() {
  const menu = $("wait-game-menu");
  menu.innerHTML = "";
  let games = [];
  try {
    const r = await fetch("/api/minigames");
    games = (await r.json()).minigames;
  } catch (e) { /* 빈 메뉴 */ }
  if (!games.length) {
    menu.innerHTML = '<p style="font-size:26px;color:#999">미니게임 준비 중!</p>';
    return;
  }
  for (const g of games) {
    const b = document.createElement("button");
    b.innerHTML = `<span class="g-emoji">${g.emoji}</span><span>${g.title}</span>` +
      (g.desc ? `<span class="g-desc">${g.desc}</span>` : "");
    b.addEventListener("click", () => { clickBeep(); openGame(g.url); });
    menu.appendChild(b);
  }
}
function openGame(url) {
  setGameFrame(url);
  $("wait-game-menu").classList.add("hidden");
  $("wait-game-frame-wrap").classList.remove("hidden");
}
function exitGame() {
  clearGameFrame();
  $("wait-game-frame-wrap").classList.add("hidden");
  $("wait-game-menu").classList.remove("hidden");
}
$("btn-game-exit").addEventListener("click", () => { exitGame(); selectTab("game"); });

function renderWaitIntro() {
  if (!introImages.length) return;
  $("wait-intro-img").src = introImages[waitIntroIdx];
}
$("btn-wintro-prev").addEventListener("click", () => {
  if (!introImages.length) return;
  waitIntroIdx = (waitIntroIdx - 1 + introImages.length) % introImages.length; renderWaitIntro();
});
$("btn-wintro-next").addEventListener("click", () => {
  if (!introImages.length) return;
  waitIntroIdx = (waitIntroIdx + 1) % introImages.length; renderWaitIntro();
});

/* ── ⑦ 띵동 호출 — 최우선 인터럽트 ── */
function onCalled(number) {
  exitGame(); // 게임 상태는 버린다 (호출이 항상 우선)
  $("called-number").textContent = `No. ${String(number).padStart(3, "0")}`;
  show("called");
  dingDong(3);
  setTimeout(() => { myNumber = null; show("attract"); }, calledSeconds * 1000);
}

/* ── WebSocket (자동 재접속) ── */
function connectWS() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  const ws = new WebSocket(`${proto}://${location.host}/ws`);
  ws.onmessage = (ev) => {
    let msg;
    try { msg = JSON.parse(ev.data); } catch { return; }
    if (msg.type === "called" && msg.station === STATION) onCalled(msg.number);
  };
  ws.onclose = () => setTimeout(connectWS, 2000); // 무고장 우선: 끊기면 재접속
  ws.onerror = () => ws.close();
  // keepalive
  setInterval(() => { if (ws.readyState === 1) ws.send("ping"); }, 25000);
}

/* ── 초기화 ── */
async function init() {
  buildKeypad();
  connectWS();
  try {
    const conf = await (await fetch("/api/config")).json();
    calledSeconds = conf.called_seconds || 12;
    codeLen = conf.code_length || 4;
  } catch (e) { /* 기본값 유지 */ }
  try {
    introImages = (await (await fetch("/api/intro")).json()).intro;
  } catch (e) { introImages = []; }
  show("attract");
}
init();
